# Zapstore release jobs for production tags (vX.Y.Z).
#
# Included from .gitlab-ci.yml only when CI_COMMIT_TAG matches vX.Y.Z, in the
# same pipeline as android-release-prepare. Not a child pipeline: a trigger
# bridge is omitted from the pipeline jobs list.
#
# Self-contained build: npm ci → build → cap sync → gradle assembleRelease.
# VERSION_NAME/VERSION_CODE come from android-release-prepare dotenv artifacts.
# zapstore-release (manual) is the gate; these jobs need it, so they are created
# on the tag pipeline and run after that play.
# See docs/ci/zapstore-pipeline.md

include:
  - local: .gitlab/ci/fetch-ci-vars.yml

# No stages key here. Included files that set stages replace the parent array
# (stages is not a hash). Jobs use deploy-android from .gitlab-ci.yml.

.zapstore-production-tag:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

.zapstore-env-guard:
  before_script:
    - |
      export RELEASE_TAG="${PARENT_CI_COMMIT_TAG:-${CI_COMMIT_TAG:-}}"
      if [ -z "$RELEASE_TAG" ]; then
        echo "ERROR: RELEASE_TAG not set (expected PARENT_CI_COMMIT_TAG from parent pipeline)."
        exit 1
      fi
      if [ -z "${VERSION_NAME:-}" ] || [ -z "${VERSION_CODE:-}" ]; then
        echo "ERROR: VERSION_NAME and VERSION_CODE are required from android-release-prepare."
        exit 1
      fi
      echo "Zapstore release: tag=${RELEASE_TAG} versionName=${VERSION_NAME} versionCode=${VERSION_CODE}"

.zapstore-keystore-setup:
  before_script:
    - !reference [.fetch-ci-var-functions, before_script]
    - |
      set -eu
      for var in ZAPSTORE_KEYSTORE_BASE64 ZAPSTORE_KEYSTORE_PASSWORD ZAPSTORE_KEY_ALIAS ZAPSTORE_KEY_PASSWORD; do
        load_ci_var "$var" || true
      done
      for var in ZAPSTORE_KEYSTORE_BASE64 ZAPSTORE_KEYSTORE_PASSWORD ZAPSTORE_KEY_ALIAS ZAPSTORE_KEY_PASSWORD; do
        eval "value=\${$var:-}"
        if [ -z "$value" ]; then
          explain_empty_secret "$var"
          exit 1
        fi
      done
      mkdir -p android/app
      printf '%s' "${ZAPSTORE_KEYSTORE_BASE64}" | base64 -d > android/app/bittasker-release-key.jks
      if [ ! -s android/app/bittasker-release-key.jks ]; then
        echo "ERROR: decoded keystore is empty"
        exit 1
      fi
      magic=$(head -c 4 android/app/bittasker-release-key.jks | od -An -tx1 | tr -d ' \n')
      if [ "$magic" = "feedfeed" ]; then store_type=jks; else store_type=pkcs12; fi
      printf '%s\n' \
        "storeFile=bittasker-release-key.jks" \
        "storeType=${store_type}" \
        "storePassword=${ZAPSTORE_KEYSTORE_PASSWORD}" \
        "keyAlias=${ZAPSTORE_KEY_ALIAS}" \
        "keyPassword=${ZAPSTORE_KEY_PASSWORD}" \
        > android/keystore.properties
      keytool -list -storetype "$store_type" -keystore android/app/bittasker-release-key.jks \
        -storepass "${ZAPSTORE_KEYSTORE_PASSWORD}" -alias "${ZAPSTORE_KEY_ALIAS}" >/dev/null
      echo "Keystore OK: alias=${ZAPSTORE_KEY_ALIAS} storeType=${store_type}"
    - echo "sdk.dir=${ANDROID_HOME}" > android/local.properties
  after_script:
    - rm -f android/app/bittasker-release-key.jks android/keystore.properties android/local.properties

validate-tag:
  extends: .zapstore-production-tag
  stage: deploy-android
  image: alpine:latest
  tags:
    - self-hosted
  needs:
    - job: zapstore-release
    - job: android-release-prepare
      artifacts: true
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: "0"
  script:
    - apk add --no-cache git
    - |
      set -eu
      export RELEASE_TAG="${PARENT_CI_COMMIT_TAG:-${CI_COMMIT_TAG:-}}"
      if [ -z "$RELEASE_TAG" ]; then
        echo "ERROR: RELEASE_TAG not set."
        exit 1
      fi
      if [ -z "${VERSION_NAME:-}" ] || [ -z "${VERSION_CODE:-}" ]; then
        echo "ERROR: VERSION_NAME and VERSION_CODE are required from android-release-prepare."
        exit 1
      fi
      if ! git merge-base --is-ancestor "$RELEASE_TAG" origin/master 2>/dev/null; then
        echo "ERROR: Tag $RELEASE_TAG is not on master."
        exit 1
      fi
      echo "Tag OK: ${RELEASE_TAG} → versionName=${VERSION_NAME} versionCode=${VERSION_CODE}"

validate-zapstore-keystore:
  stage: deploy-android
  image: reactnativecommunity/react-native-android:latest
  tags:
    - self-hosted
  extends:
    - .zapstore-keystore-setup
    - .zapstore-production-tag
  needs:
    - job: zapstore-release
  environment:
    name: production
  script:
    - echo "Zapstore keystore validated in before_script"

check-zapstore-release-exists:
  extends: .zapstore-production-tag
  stage: deploy-android
  image: registry.gitlab.com/gitlab-org/cli:latest
  tags:
    - self-hosted
  needs:
    - job: zapstore-release
  environment:
    name: production
  variables:
    GLAB_TOKEN: $ZAPSTORE_GITLAB_TOKEN
  script:
    - |
      apk add --no-cache curl jq >/dev/null 2>&1
      export RELEASE_TAG="${PARENT_CI_COMMIT_TAG:-${CI_COMMIT_TAG:-}}"
      API="https://gitlab.com/api/v4"
      PROJECT="bittasker%2Fzapstore"
      HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
        -H "PRIVATE-TOKEN: ${ZAPSTORE_GITLAB_TOKEN}" \
        "${API}/projects/${PROJECT}/releases/${RELEASE_TAG}")
      if [ "$HTTP_CODE" = "200" ]; then
        echo "Release ${RELEASE_TAG} already exists on bittasker/zapstore."
        echo "ZAPSTORE_RELEASE_EXISTS=true" >> release.env
      else
        echo "Release ${RELEASE_TAG} does not exist (HTTP ${HTTP_CODE})."
        echo "ZAPSTORE_RELEASE_EXISTS=false" >> release.env
      fi
  artifacts:
    reports:
      dotenv: release.env

assemble-zapstore-apk:
  stage: deploy-android
  image: reactnativecommunity/react-native-android:latest
  tags:
    - self-hosted
  extends:
    - .zapstore-env-guard
    - .zapstore-keystore-setup
    - .zapstore-production-tag
  environment:
    name: production
  before_script:
    - !reference [.zapstore-env-guard, before_script]
    - !reference [.zapstore-keystore-setup, before_script]
  needs:
    - job: validate-tag
    - job: validate-zapstore-keystore
    - job: android-release-prepare
      artifacts: true
  script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends openjdk-21-jdk
    - export JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64
    - export PATH="$JAVA_HOME/bin:$PATH"
    - java -version
    - npm ci
    - npm run build
    - npx cap sync android
    - ./android/gradlew assembleRelease -p android
    - |
      echo "=== Searching for APK ==="
      find . -name '*.apk' -not -path '*/debug/*' | head -20
      APK_SRC="$(find . -name 'app-universal-release.apk' -not -path '*/debug/*' | head -1)"
      if [ -z "$APK_SRC" ]; then
        echo "ERROR: universal APK not found anywhere"
        exit 1
      fi
      echo "Found APK at: ${APK_SRC}"
      APK_DST="$(dirname "$APK_SRC")/bittasker-v${VERSION_NAME}-universal.apk"
      cp "$APK_SRC" "$APK_DST"
      echo "Built ${APK_DST}"
  artifacts:
    paths:
      - "**/bittasker-v*-universal.apk"
    expire_in: 30 days

generate-changelog:
  extends: .zapstore-production-tag
  stage: deploy-android
  image:
    name: orhunp/git-cliff:latest
    entrypoint: [""]
  tags:
    - self-hosted
  needs:
    - assemble-zapstore-apk
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: "0"
  script:
    - |
      export RELEASE_TAG="${PARENT_CI_COMMIT_TAG:-${CI_COMMIT_TAG:-}}"
      if [ -z "$RELEASE_TAG" ]; then
        echo "ERROR: RELEASE_TAG not set"
        exit 1
      fi
      git-cliff --latest --strip all -o release-notes.md
      if [ -f CHANGELOG.md ]; then
        git-cliff --unreleased --tag "$RELEASE_TAG" --prepend CHANGELOG.md
      else
        git-cliff --unreleased --tag "$RELEASE_TAG" -o CHANGELOG.md
      fi
  artifacts:
    paths:
      - release-notes.md
      - CHANGELOG.md

create-zapstore-gitlab-release:
  extends: .zapstore-production-tag
  stage: deploy-android
  image: registry.gitlab.com/gitlab-org/cli:latest
  tags:
    - self-hosted
  retry: 0
  environment:
    name: production
  needs:
    - assemble-zapstore-apk
    - generate-changelog
    - check-zapstore-release-exists
  variables:
    GLAB_TOKEN: $ZAPSTORE_GITLAB_TOKEN
  script:
    - |
      apk add --no-cache curl jq >/dev/null 2>&1
      set -eu
      export RELEASE_TAG="${PARENT_CI_COMMIT_TAG:-${CI_COMMIT_TAG:-}}"
      VERSION="${RELEASE_TAG#v}"
      APK="$(find . -name "bittasker-v${VERSION}-universal.apk" | head -1)"
      if [ -z "$APK" ]; then
        echo "ERROR: APK bittasker-v${VERSION}-universal.apk not found"
        find . -name '*.apk' | head -10
        exit 1
      fi
      echo "Found APK at: ${APK}"
      if [ "${ZAPSTORE_RELEASE_EXISTS}" = "true" ]; then
        echo "Release already exists — skipping."
        exit 0
      fi
      API="https://gitlab.com/api/v4"
      PROJECT="bittasker%2Fzapstore"
      AUTH="PRIVATE-TOKEN: ${ZAPSTORE_GITLAB_TOKEN}"
      # Step 1: Create tag on bittasker/zapstore
      echo "Creating tag ${RELEASE_TAG} on bittasker/zapstore..."
      TAG_HTTP=$(curl -s -o /dev/null -w "%{http_code}" \
        -H "$AUTH" \
        -X POST "${API}/projects/${PROJECT}/repository/tags" \
        -F "tag_name=${RELEASE_TAG}" \
        -F "ref=main")
      if [ "$TAG_HTTP" = "201" ]; then
        echo "Tag created."
      elif [ "$TAG_HTTP" = "400" ]; then
        echo "Tag already exists, continuing."
      else
        echo "ERROR: Tag creation returned HTTP ${TAG_HTTP}"
        exit 1
      fi
      # Step 2: Upload APK to bittasker/zapstore
      echo "Uploading APK..."
      UPLOAD_JSON=$(curl -sf -H "$AUTH" \
        -X POST "${API}/projects/${PROJECT}/uploads" \
        -F "file=@${APK}")
      UPLOAD_PATH=$(echo "$UPLOAD_JSON" | jq -r '.url // empty')
      if [ -z "$UPLOAD_PATH" ]; then
        echo "ERROR: Failed to upload APK. Response: ${UPLOAD_JSON}"
        exit 1
      fi
      DOWNLOAD_URL="https://gitlab.com/bittasker/zapstore${UPLOAD_PATH}"
      echo "APK uploaded: ${DOWNLOAD_URL}"
      # Step 3: Create release
      echo "Creating release ${RELEASE_TAG}..."
      DESCRIPTION=$(jq -Rs . < release-notes.md)
      RELEASE_HTTP=$(curl -s -o /tmp/release-response.json -w "%{http_code}" \
        -H "$AUTH" \
        -H "Content-Type: application/json" \
        -X POST "${API}/projects/${PROJECT}/releases" \
        -d "{
          \"tag_name\": \"${RELEASE_TAG}\",
          \"name\": \"BitTasker v${VERSION}\",
          \"description\": ${DESCRIPTION},
          \"assets\": {
            \"links\": [{
              \"name\": \"bittasker-v${VERSION}-universal.apk\",
              \"url\": \"${DOWNLOAD_URL}\"
            }]
          }
        }")
      if [ "$RELEASE_HTTP" = "201" ]; then
        echo "Release created successfully!"
      else
        echo "ERROR: Release creation returned HTTP ${RELEASE_HTTP}"
        cat /tmp/release-response.json 2>/dev/null
        exit 1
      fi

publish-zapstore:
  extends: .zapstore-production-tag
  stage: deploy-android
  image: reactnativecommunity/react-native-android:latest
  tags:
    - self-hosted
  retry: 1
  environment:
    name: production
  needs:
    - create-zapstore-gitlab-release
    - assemble-zapstore-apk
  variables:
    SIGN_WITH: $ZAPSTORE_PUBLISHER_NSEC
  script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends curl
    - curl -fsSL https://go.dev/dl/go1.24.4.linux-amd64.tar.gz | tar -C /usr/local -xzf -
    - export PATH="/usr/local/go/bin:$HOME/go/bin:${PATH}"
    - go version
    - go install github.com/zapstore/zsp@latest
    - |
      git clone --depth 1 "https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/bittasker/zapstore.git" /tmp/zapstore
      APK="$(find . -name 'bittasker-v*-universal.apk' | head -1)"
      if [ -z "$APK" ]; then
        echo "ERROR: APK artifact not found"
        exit 1
      fi
      cp "$APK" /tmp/zapstore/
      APK_NAME="$(basename "$APK")"
      echo "release_source: ./${APK_NAME}" >> /tmp/zapstore/zapstore.yaml
      cd /tmp/zapstore
      zsp publish --quiet zapstore.yaml
