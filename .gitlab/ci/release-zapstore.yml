# Zapstore release child pipeline — triggered from .gitlab-ci.yml on production tags (vX.Y.Z).
#
# Reuses parent android-release-web artifacts (one npm build + cap sync). Gradle only here (Zapstore JKS).
# See docs/ci/zapstore-pipeline.md

include:
  - local: .gitlab/ci/fetch-ci-vars.yml

stages:
  - preflight
  - build
  - changelog
  - gitlab-release
  - publish-zapstore

.zapstore-env-guard:
  before_script:
    - |
      export RELEASE_TAG="${PARENT_CI_COMMIT_TAG:-${CI_COMMIT_TAG:-}}"
      if [ -z "$RELEASE_TAG" ]; then
        echo "ERROR: RELEASE_TAG not set (expected PARENT_CI_COMMIT_TAG from parent pipeline)."
        exit 1
      fi
      if [ -z "${VERSION_NAME:-}" ] || [ -z "${VERSION_CODE:-}" ]; then
        echo "ERROR: VERSION_NAME and VERSION_CODE are required from android-release-prepare."
        exit 1
      fi
      if [ -z "${PARENT_PIPELINE_ID:-}" ]; then
        echo "ERROR: PARENT_PIPELINE_ID not set (required for parent web build artifacts)."
        exit 1
      fi
      echo "Zapstore release: tag=${RELEASE_TAG} versionName=${VERSION_NAME} versionCode=${VERSION_CODE}"

.zapstore-keystore-setup:
  before_script:
    - !reference [.fetch-ci-var-functions, before_script]
    - |
      set -eu
      for var in ZAPSTORE_KEYSTORE_BASE64 ZAPSTORE_KEYSTORE_PASSWORD ZAPSTORE_KEY_ALIAS ZAPSTORE_KEY_PASSWORD; do
        load_ci_var "$var" || true
      done
      for var in ZAPSTORE_KEYSTORE_BASE64 ZAPSTORE_KEYSTORE_PASSWORD ZAPSTORE_KEY_ALIAS ZAPSTORE_KEY_PASSWORD; do
        eval "value=\${$var:-}"
        if [ -z "$value" ]; then
          explain_empty_secret "$var"
          exit 1
        fi
      done
      mkdir -p android/app
      printf '%s' "${ZAPSTORE_KEYSTORE_BASE64}" | base64 -d > android/app/bittasker-release-key.jks
      if [ ! -s android/app/bittasker-release-key.jks ]; then
        echo "ERROR: decoded keystore is empty"
        exit 1
      fi
      magic=$(head -c 4 android/app/bittasker-release-key.jks | od -An -tx1 | tr -d ' \n')
      if [ "$magic" = "feedfeed" ]; then store_type=jks; else store_type=pkcs12; fi
      printf '%s\n' \
        "storeFile=bittasker-release-key.jks" \
        "storeType=${store_type}" \
        "storePassword=${ZAPSTORE_KEYSTORE_PASSWORD}" \
        "keyAlias=${ZAPSTORE_KEY_ALIAS}" \
        "keyPassword=${ZAPSTORE_KEY_PASSWORD}" \
        > android/keystore.properties
      keytool -list -storetype "$store_type" -keystore android/app/bittasker-release-key.jks \
        -storepass "${ZAPSTORE_KEYSTORE_PASSWORD}" -alias "${ZAPSTORE_KEY_ALIAS}" >/dev/null
      echo "Keystore OK: alias=${ZAPSTORE_KEY_ALIAS} storeType=${store_type}"
    - echo "sdk.dir=${ANDROID_HOME}" > android/local.properties
  after_script:
    - rm -f android/app/bittasker-release-key.jks android/keystore.properties android/local.properties

validate-tag:
  stage: preflight
  image: alpine:latest
  tags:
    - self-hosted
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: "0"
  script:
    - apk add --no-cache git
    - |
      set -eu
      export RELEASE_TAG="${PARENT_CI_COMMIT_TAG:-${CI_COMMIT_TAG:-}}"
      if [ -z "$RELEASE_TAG" ]; then
        echo "ERROR: RELEASE_TAG not set."
        exit 1
      fi
      if [ -z "${VERSION_NAME:-}" ] || [ -z "${VERSION_CODE:-}" ]; then
        echo "ERROR: VERSION_NAME and VERSION_CODE are required from android-release-prepare."
        exit 1
      fi
      if ! git merge-base --is-ancestor "$RELEASE_TAG" origin/master 2>/dev/null; then
        echo "ERROR: Tag $RELEASE_TAG is not on master."
        exit 1
      fi
      echo "Tag OK: ${RELEASE_TAG} → versionName=${VERSION_NAME} versionCode=${VERSION_CODE}"

validate-zapstore-keystore:
  stage: preflight
  image: reactnativecommunity/react-native-android:latest
  tags:
    - self-hosted
  extends: .zapstore-keystore-setup
  environment:
    name: production
  script:
    - echo "Zapstore keystore validated in before_script"

check-zapstore-release-exists:
  stage: preflight
  image: registry.gitlab.com/gitlab-org/cli:latest
  tags:
    - self-hosted
  environment:
    name: production
  script:
    - |
      export RELEASE_TAG="${PARENT_CI_COMMIT_TAG:-${CI_COMMIT_TAG:-}}"
      if glab release view "${RELEASE_TAG}" --repo bittasker/zapstore >/dev/null 2>&1; then
        echo "GitLab release ${RELEASE_TAG} already exists on bittasker/zapstore — skipping duplicate publish."
        echo "ZAPSTORE_RELEASE_EXISTS=true" >> release.env
      else
        echo "ZAPSTORE_RELEASE_EXISTS=false" >> release.env
      fi
  variables:
    GLAB_TOKEN: $ZAPSTORE_GITLAB_TOKEN
  artifacts:
    reports:
      dotenv: release.env

assemble-zapstore-apk:
  stage: build
  image: reactnativecommunity/react-native-android:latest
  tags:
    - self-hosted
  extends:
    - .zapstore-env-guard
    - .zapstore-keystore-setup
  environment:
    name: production
  before_script:
    - !reference [.zapstore-env-guard, before_script]
    - !reference [.zapstore-keystore-setup, before_script]
  needs:
    - job: validate-tag
    - job: validate-zapstore-keystore
    - pipeline: $PARENT_PIPELINE_ID
      job: android-release-web
      artifacts: true
  script:
    - npm ci
    - cd android && ./gradlew assembleRelease
    - |
      APK_SRC="android/app/build/outputs/apk/release/app-universal-release.apk"
      APK_DST="android/app/build/outputs/apk/release/bittasker-v${VERSION_NAME}-universal.apk"
      cp "$APK_SRC" "$APK_DST"
      echo "Built ${APK_DST}"
  artifacts:
    paths:
      - android/app/build/outputs/apk/release/bittasker-v*-universal.apk
    expire_in: 30 days

generate-changelog:
  stage: changelog
  image: orhunp/git-cliff:latest
  tags:
    - self-hosted
  needs:
    - assemble-zapstore-apk
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: "0"
  script:
    - |
      export RELEASE_TAG="${PARENT_CI_COMMIT_TAG:-${CI_COMMIT_TAG:-}}"
      git-cliff --latest --strip all -o release-notes.md
      if [ -f CHANGELOG.md ]; then
        git-cliff --unreleased --tag "${RELEASE_TAG}" --prepend CHANGELOG.md
      else
        git-cliff --unreleased --tag "${RELEASE_TAG}" -o CHANGELOG.md
      fi
  artifacts:
    paths:
      - release-notes.md
      - CHANGELOG.md

create-zapstore-gitlab-release:
  stage: gitlab-release
  image: registry.gitlab.com/gitlab-org/cli:latest
  tags:
    - self-hosted
  retry: 0
  environment:
    name: production
  needs:
    - assemble-zapstore-apk
    - generate-changelog
    - check-zapstore-release-exists
  variables:
    GLAB_TOKEN: $ZAPSTORE_GITLAB_TOKEN
  script:
    - |
      export RELEASE_TAG="${PARENT_CI_COMMIT_TAG:-${CI_COMMIT_TAG:-}}"
      VERSION="${RELEASE_TAG#v}"
      APK="android/app/build/outputs/apk/release/bittasker-v${VERSION}-universal.apk"
      if [ "${ZAPSTORE_RELEASE_EXISTS}" = "true" ]; then
        echo "Release already exists — skipping glab release create."
        exit 0
      fi
      glab release create "${RELEASE_TAG}" \
        --repo bittasker/zapstore \
        --name "BitTasker v${VERSION}" \
        --notes-file release-notes.md \
        "${APK}"
  rules:
    - when: on_success

publish-zapstore:
  stage: publish-zapstore
  image: reactnativecommunity/react-native-android:latest
  tags:
    - self-hosted
  retry: 1
  when: manual
  environment:
    name: production
  needs:
    - create-zapstore-gitlab-release
  variables:
    SIGN_WITH: $ZAPSTORE_PUBLISHER_NSEC
  script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends golang-go curl
    - go install github.com/zapstore/zsp@latest
    - export PATH="${PATH}:$(go env GOPATH)/bin"
    - |
      git clone --depth 1 "https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/bittasker/zapstore.git" /tmp/zapstore
      cd /tmp/zapstore
      zsp publish -y --quiet zapstore.yaml
  rules:
    - when: manual
