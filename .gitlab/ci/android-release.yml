# Android production + internal release jobs (included from .gitlab-ci.yml).
# See docs/ci/play-store-pipeline.md and docs/ci/zapstore-pipeline.md
#
# Protected ANDROID_KEYSTORE_* variables are only auto-injected on protected tags/branches.
# Release tags (v*-alpha*) must be protected (Settings → Repository → Protected tags → v*)
# or variables are loaded via GitLab API (.gitlab/ci/fetch-ci-vars.yml).

include:
  - local: .gitlab/ci/fetch-ci-vars.yml

.android-play-keystore-setup:
  before_script:
    - !reference [.fetch-ci-var-functions, before_script]
    - |
      set -eu
      for var in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_STORE_PASSWORD ANDROID_KEYSTORE_KEY_ALIAS ANDROID_KEYSTORE_KEY_PASSWORD; do
        load_ci_var "$var" || true
      done
      for var in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_STORE_PASSWORD ANDROID_KEYSTORE_KEY_ALIAS ANDROID_KEYSTORE_KEY_PASSWORD; do
        eval "value=\${$var:-}"
        if [ -z "$value" ]; then
          explain_empty_secret "$var"
          exit 1
        fi
      done
      mkdir -p android/app
      printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 -d > android/app/upload-keystore.jks
      if [ ! -s android/app/upload-keystore.jks ]; then
        echo "ERROR: decoded keystore is empty"
        exit 1
      fi
      magic=$(head -c 4 android/app/upload-keystore.jks | od -An -tx1 | tr -d ' \n')
      if [ "$magic" = "feedfeed" ]; then store_type=jks; else store_type=pkcs12; fi
      printf '%s\n' \
        "storeFile=upload-keystore.jks" \
        "storeType=${store_type}" \
        "storePassword=${ANDROID_KEYSTORE_STORE_PASSWORD}" \
        "keyAlias=${ANDROID_KEYSTORE_KEY_ALIAS}" \
        "keyPassword=${ANDROID_KEYSTORE_KEY_PASSWORD}" \
        > android/keystore.properties
      keytool -list -storetype "$store_type" -keystore android/app/upload-keystore.jks \
        -storepass "${ANDROID_KEYSTORE_STORE_PASSWORD}" -alias "${ANDROID_KEYSTORE_KEY_ALIAS}" >/dev/null
      echo "Keystore OK: alias=${ANDROID_KEYSTORE_KEY_ALIAS} storeType=${store_type}"
    - |
      set -eu
      load_ci_var PLAY_STORE_CREDENTIALS_JSON || true
      if [ -z "${PLAY_STORE_CREDENTIALS_JSON:-}" ]; then
        explain_empty_secret PLAY_STORE_CREDENTIALS_JSON
        exit 1
      fi
      mkdir -p fastlane
      if [ -f "${PLAY_STORE_CREDENTIALS_JSON}" ]; then
        cp "${PLAY_STORE_CREDENTIALS_JSON}" fastlane/play-store-credentials.json
      else
        printf '%s' "${PLAY_STORE_CREDENTIALS_JSON}" > fastlane/play-store-credentials.json
      fi
      if [ ! -s fastlane/play-store-credentials.json ]; then
        echo "ERROR: play-store-credentials.json is empty"
        exit 1
      fi
      if ! grep -q '"client_email"' fastlane/play-store-credentials.json; then
        echo "ERROR: play-store-credentials.json is not valid service account JSON (missing client_email)"
        exit 1
      fi
      export GOOGLE_APPLICATION_CREDENTIALS="${CI_PROJECT_DIR}/fastlane/play-store-credentials.json"
      echo "Play credentials OK ($(grep -o '"client_email"[[:space:]]*:[[:space:]]*"[^"]*"' fastlane/play-store-credentials.json | head -1))"

.android-ci-setup:
  before_script:
    - |
      apt-get update -qq && apt-get install -y -qq --no-install-recommends \
        ruby-full ruby-dev build-essential openjdk-21-jdk
      export JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64
      export PATH="$JAVA_HOME/bin:$PATH"
      java -version
      gem install bundler -v '~>2.5' --no-document
      bundle install --quiet

.android-cache:
  cache:
    - key:
        files:
          - android/build.gradle
          - android/app/build.gradle
      paths:
        - .gradle/caches/
      policy: pull-push
    - key:
        files:
          - android/gradle/wrapper/gradle-wrapper.properties
      paths:
        - .gradle/wrapper/
      policy: pull-push

.android-release-env-guard:
  before_script:
    - |
      if [ -z "${VERSION_NAME:-}" ] || [ -z "${VERSION_CODE:-}" ]; then
        echo "ERROR: VERSION_NAME and VERSION_CODE are required. android-release-prepare must run first."
        exit 1
      fi
      echo "Android release: versionName=${VERSION_NAME} versionCode=${VERSION_CODE}"

# VERSION_NAME from tag. VERSION_CODE tracked via GitLab Release metadata (no repo commits).
android-release-prepare:
  stage: android-prepare
  image: alpine:latest
  tags:
    - self-hosted
  resource_group: android-production-release
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: "0"
  script:
    - apk add --no-cache git curl
    - |
      set -eu
      VERSION_NAME="${CI_COMMIT_TAG#v}"
      if ! echo "$VERSION_NAME" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
        echo "ERROR: Production tag must be vX.Y.Z (got ${CI_COMMIT_TAG})"
        exit 1
      fi
      if ! git merge-base --is-ancestor "$CI_COMMIT_TAG" origin/master 2>/dev/null; then
        echo "ERROR: Tag ${CI_COMMIT_TAG} is not on master."
        exit 1
      fi
      RELEASE_JSON=""
      VERSION_CODE=""
      if RELEASE_JSON="$(curl -sf --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases/${CI_COMMIT_TAG}" 2>/dev/null)"; then
        EXISTING_CODE="$(printf '%s' "$RELEASE_JSON" | sed -n 's/.*versionCode: \([0-9][0-9]*\).*/\1/p' | head -1)"
        if [ -n "$EXISTING_CODE" ]; then
          VERSION_CODE="$EXISTING_CODE"
          echo "Reusing versionCode ${VERSION_CODE} from GitLab Release ${CI_COMMIT_TAG}."
        fi
      fi
      if [ -z "${VERSION_CODE:-}" ]; then
        BASE="${ANDROID_RELEASE_VERSION_CODE:-}"
        if ! echo "$BASE" | grep -qE '^[0-9]+$'; then
          echo "ERROR: Set ANDROID_RELEASE_VERSION_CODE to the current Play Store versionCode (e.g. 15)."
          exit 1
        fi
        VERSION_CODE=$((BASE + 1))
        echo "Assigning versionCode ${VERSION_CODE} (from ANDROID_RELEASE_VERSION_CODE=${BASE})."
        if [ -z "${CI_API_TOKEN:-}" ]; then
          echo "ERROR: CI_API_TOKEN is required (project access token with api scope)."
          exit 1
        fi
        curl -sf --request POST --header "PRIVATE-TOKEN: ${CI_API_TOKEN}" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases" \
          --form "tag_name=${CI_COMMIT_TAG}" \
          --form "name=Android prepare ${CI_COMMIT_TAG}" \
          --form "description=versionCode: ${VERSION_CODE}" \
          --form "ref=${CI_COMMIT_TAG}"
        if curl -sf --request GET --header "PRIVATE-TOKEN: ${CI_API_TOKEN}" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/variables/ANDROID_RELEASE_VERSION_CODE" >/dev/null 2>&1; then
          curl -sf --request PUT --header "PRIVATE-TOKEN: ${CI_API_TOKEN}" \
            "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/variables/ANDROID_RELEASE_VERSION_CODE" \
            --form "value=${VERSION_CODE}"
        else
          curl -sf --request POST --header "PRIVATE-TOKEN: ${CI_API_TOKEN}" \
            "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/variables" \
            --form "key=ANDROID_RELEASE_VERSION_CODE" \
            --form "value=${VERSION_CODE}" \
            --form "protected=true" \
            --form "masked=false"
        fi
      fi
      {
        echo "VERSION_NAME=${VERSION_NAME}"
        echo "VERSION_CODE=${VERSION_CODE}"
        echo "CI_COMMIT_TAG=${CI_COMMIT_TAG}"
      } > release.env
      cat release.env
  artifacts:
    reports:
      dotenv: release.env
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

# One web build + cap sync per production tag (keystore changes only affect Gradle signing).
android-release-web:
  extends: .android-cache
  stage: build-android
  image: reactnativecommunity/react-native-android:latest
  tags:
    - self-hosted
  needs:
    - job: android-release-prepare
      artifacts: true
  script:
    - !reference [.android-release-env-guard, before_script]
    - npm ci
    - npm run build
    - npx cap sync android
  environment:
    name: production
  artifacts:
    paths:
      - build/
      - android/app/src/main/assets/
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

android-build-internal:
  extends: .android-cache
  stage: build-android
  image: reactnativecommunity/react-native-android:latest
  tags:
    - self-hosted
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: "0"
    # CI_PIPELINE_ID exceeds Android versionCode int32 max (~2.1B); map into valid range.
    ANDROID_PIPELINE_OFFSET: "2400000000"
  before_script:
    - |
      export VERSION_NAME="${CI_COMMIT_TAG#v}"
      if [ -z "${VERSION_NAME:-}" ]; then
        echo "ERROR: CI_COMMIT_TAG is required for internal testing builds."
        exit 1
      fi
      git fetch origin dev --quiet
      if ! git merge-base --is-ancestor HEAD origin/dev 2>/dev/null; then
        echo "ERROR: Internal testing tags must be on dev (tag ${CI_COMMIT_TAG} is not on origin/dev)."
        exit 1
      fi
      export VERSION_CODE=$((CI_PIPELINE_ID - ANDROID_PIPELINE_OFFSET))
      if [ "$VERSION_CODE" -lt 1 ] || [ "$VERSION_CODE" -gt 2147483647 ]; then
        echo "ERROR: VERSION_CODE out of Android range: $VERSION_CODE (pipeline=$CI_PIPELINE_ID offset=$ANDROID_PIPELINE_OFFSET)"
        exit 1
      fi
      echo "Internal testing build: versionName=$VERSION_NAME versionCode=$VERSION_CODE (pipeline=$CI_PIPELINE_ID)"
    - !reference [.android-play-keystore-setup, before_script]
    - !reference [.android-ci-setup, before_script]
  script:
    - export GOOGLE_APPLICATION_CREDENTIALS="${CI_PROJECT_DIR}/fastlane/play-store-credentials.json"
    - export SUPPLY_PACKAGE_NAME="com.bittasker.app"
    - bundle exec fastlane android preflight
    - bundle exec fastlane android internal
  after_script:
    - rm -f android/app/upload-keystore.jks fastlane/play-store-credentials.json android/keystore.properties
  artifacts:
    paths:
      - android/app/build/outputs/bundle/release/
    expire_in: 7 days
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+-(alpha|beta)/
  environment:
    name: production

android-release-production:
  extends: .android-cache
  stage: deploy-android
  image: reactnativecommunity/react-native-android:latest
  tags:
    - self-hosted
  needs:
    - job: android-release-prepare
      artifacts: true
    - job: android-release-web
      artifacts: true
  variables:
    ANDROID_SKIP_WEB_BUILD: "1"
  before_script:
    - !reference [.android-release-env-guard, before_script]
    - !reference [.android-ci-setup, before_script]
    - npm ci
    - !reference [.android-play-keystore-setup, before_script]
  script:
    - export GOOGLE_APPLICATION_CREDENTIALS="${CI_PROJECT_DIR}/fastlane/play-store-credentials.json"
    - export SUPPLY_PACKAGE_NAME="com.bittasker.app"
    - bundle exec fastlane android preflight
    - bundle exec fastlane android production
  after_script:
    - rm -f android/app/upload-keystore.jks fastlane/play-store-credentials.json android/keystore.properties
  artifacts:
    paths:
      - android/app/build/outputs/bundle/release/
    expire_in: 30 days
  when: manual
  allow_failure: false
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  environment:
    name: production
    url: https://play.google.com/store/apps/details?id=com.bittasker.app

trigger-zapstore-release:
  stage: deploy-android
  needs:
    - job: android-release-prepare
      artifacts: true
    - job: android-release-web
      artifacts: true
  variables:
    VERSION_NAME: $VERSION_NAME
    VERSION_CODE: $VERSION_CODE
    PARENT_CI_COMMIT_TAG: $CI_COMMIT_TAG
    PARENT_PIPELINE_ID: $CI_PIPELINE_ID
  trigger:
    include:
      - local: .gitlab/ci/release-zapstore.yml
    strategy: depend
    forward:
      pipeline_variables: true
  when: manual
  allow_failure: false
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
