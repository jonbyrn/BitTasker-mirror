# Android production + internal release jobs (included from .gitlab-ci.yml).
# See docs/ci/play-store-pipeline.md and docs/ci/zapstore-pipeline.md

.android-cache:
  cache:
    - key:
        files:
          - android/build.gradle
          - android/app/build.gradle
      paths:
        - .gradle/caches/
      policy: pull-push
    - key:
        files:
          - android/gradle/wrapper/gradle-wrapper.properties
      paths:
        - .gradle/wrapper/
      policy: pull-push

.android-release-env-guard:
  before_script:
    - |
      if [ -z "${VERSION_NAME:-}" ] || [ -z "${VERSION_CODE:-}" ]; then
        echo "ERROR: VERSION_NAME and VERSION_CODE are required. android-release-prepare must run first."
        exit 1
      fi
      echo "Android release: versionName=${VERSION_NAME} versionCode=${VERSION_CODE}"

# VERSION_NAME from tag. VERSION_CODE tracked via GitLab Release metadata (no repo commits).
android-release-prepare:
  stage: android-prepare
  image: alpine:latest
  tags:
    - self-hosted
  resource_group: android-production-release
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: "0"
  script:
    - apk add --no-cache git curl
    - |
      set -eu
      VERSION_NAME="${CI_COMMIT_TAG#v}"
      if ! echo "$VERSION_NAME" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
        echo "ERROR: Production tag must be vX.Y.Z (got ${CI_COMMIT_TAG})"
        exit 1
      fi
      if ! git merge-base --is-ancestor "$CI_COMMIT_TAG" origin/master 2>/dev/null; then
        echo "ERROR: Tag ${CI_COMMIT_TAG} is not on master."
        exit 1
      fi
      RELEASE_JSON=""
      VERSION_CODE=""
      if RELEASE_JSON="$(curl -sf --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases/${CI_COMMIT_TAG}" 2>/dev/null)"; then
        EXISTING_CODE="$(printf '%s' "$RELEASE_JSON" | sed -n 's/.*versionCode: \([0-9][0-9]*\).*/\1/p' | head -1)"
        if [ -n "$EXISTING_CODE" ]; then
          VERSION_CODE="$EXISTING_CODE"
          echo "Reusing versionCode ${VERSION_CODE} from GitLab Release ${CI_COMMIT_TAG}."
        fi
      fi
      if [ -z "${VERSION_CODE:-}" ]; then
        BASE="${ANDROID_RELEASE_VERSION_CODE:-}"
        if ! echo "$BASE" | grep -qE '^[0-9]+$'; then
          echo "ERROR: Set ANDROID_RELEASE_VERSION_CODE to the current Play Store versionCode (e.g. 15)."
          exit 1
        fi
        VERSION_CODE=$((BASE + 1))
        echo "Assigning versionCode ${VERSION_CODE} (from ANDROID_RELEASE_VERSION_CODE=${BASE})."
        if [ -z "${CI_API_TOKEN:-}" ]; then
          echo "ERROR: CI_API_TOKEN is required (project access token with api scope)."
          exit 1
        fi
        curl -sf --request POST --header "PRIVATE-TOKEN: ${CI_API_TOKEN}" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases" \
          --form "tag_name=${CI_COMMIT_TAG}" \
          --form "name=Android prepare ${CI_COMMIT_TAG}" \
          --form "description=versionCode: ${VERSION_CODE}" \
          --form "ref=${CI_COMMIT_TAG}"
        if curl -sf --request GET --header "PRIVATE-TOKEN: ${CI_API_TOKEN}" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/variables/ANDROID_RELEASE_VERSION_CODE" >/dev/null 2>&1; then
          curl -sf --request PUT --header "PRIVATE-TOKEN: ${CI_API_TOKEN}" \
            "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/variables/ANDROID_RELEASE_VERSION_CODE" \
            --form "value=${VERSION_CODE}"
        else
          curl -sf --request POST --header "PRIVATE-TOKEN: ${CI_API_TOKEN}" \
            "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/variables" \
            --form "key=ANDROID_RELEASE_VERSION_CODE" \
            --form "value=${VERSION_CODE}" \
            --form "protected=true" \
            --form "masked=false"
        fi
      fi
      {
        echo "VERSION_NAME=${VERSION_NAME}"
        echo "VERSION_CODE=${VERSION_CODE}"
        echo "CI_COMMIT_TAG=${CI_COMMIT_TAG}"
      } > release.env
      cat release.env
  artifacts:
    reports:
      dotenv: release.env
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

# One web build + cap sync per production tag (keystore changes only affect Gradle signing).
android-release-web:
  extends: .android-cache
  stage: build-android
  image: reactnativecommunity/react-native-android:latest
  tags:
    - self-hosted
  needs:
    - job: android-release-prepare
      artifacts: true
  script:
    - !reference [.android-release-env-guard, before_script]
    - npm ci
    - npm run build
    - npx cap sync android
  environment:
    name: production
  artifacts:
    paths:
      - build/
      - android/app/src/main/assets/
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

android-build-internal:
  extends: .android-cache
  stage: build-android
  image: reactnativecommunity/react-native-android:latest
  tags:
    - self-hosted
  variables:
    VERSION_CODE: $CI_PIPELINE_ID
  before_script:
    - |
      export VERSION_NAME="${CI_COMMIT_TAG#v}"
      if [ -z "${VERSION_NAME:-}" ]; then
        echo "ERROR: CI_COMMIT_TAG is required for internal testing builds."
        exit 1
      fi
      echo "Internal testing build: versionName=$VERSION_NAME versionCode=$VERSION_CODE"
      apt-get update -qq && apt-get install -y -qq --no-install-recommends ruby-full ruby-dev build-essential
      gem install bundler -v '~>2.5' --no-document
      bundle install --quiet
      echo "${ANDROID_KEYSTORE_BASE64}" | base64 -d > android/upload-keystore.jks
      cat > android/keystore.properties << EOF
      storeFile=upload-keystore.jks
      storePassword=${ANDROID_KEYSTORE_STORE_PASSWORD}
      keyAlias=${ANDROID_KEYSTORE_KEY_ALIAS}
      keyPassword=${ANDROID_KEYSTORE_KEY_PASSWORD}
      EOF
      if [ -f "${PLAY_STORE_CREDENTIALS_JSON}" ]; then
        cp "${PLAY_STORE_CREDENTIALS_JSON}" fastlane/play-store-credentials.json
      else
        echo "${PLAY_STORE_CREDENTIALS_JSON}" > fastlane/play-store-credentials.json
      fi
  script:
    - bundle exec fastlane android internal
  after_script:
    - rm -f android/upload-keystore.jks fastlane/play-store-credentials.json android/keystore.properties
  artifacts:
    paths:
      - android/app/build/outputs/bundle/release/
    expire_in: 7 days
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+-(alpha|beta)/
  environment:
    name: internal-testing

android-release-production:
  extends: .android-cache
  stage: deploy-android
  image: reactnativecommunity/react-native-android:latest
  tags:
    - self-hosted
  needs:
    - job: android-release-prepare
      artifacts: true
    - job: android-release-web
      artifacts: true
  variables:
    ANDROID_SKIP_WEB_BUILD: "1"
  before_script:
    - !reference [.android-release-env-guard, before_script]
    - |
      apt-get update -qq && apt-get install -y -qq --no-install-recommends ruby-full ruby-dev build-essential
      gem install bundler -v '~>2.5' --no-document
      bundle install --quiet
      npm ci
      echo "${ANDROID_KEYSTORE_BASE64}" | base64 -d > android/upload-keystore.jks
      cat > android/keystore.properties << EOF
      storeFile=upload-keystore.jks
      storePassword=${ANDROID_KEYSTORE_STORE_PASSWORD}
      keyAlias=${ANDROID_KEYSTORE_KEY_ALIAS}
      keyPassword=${ANDROID_KEYSTORE_KEY_PASSWORD}
      EOF
      if [ -f "${PLAY_STORE_CREDENTIALS_JSON}" ]; then
        cp "${PLAY_STORE_CREDENTIALS_JSON}" fastlane/play-store-credentials.json
      else
        echo "${PLAY_STORE_CREDENTIALS_JSON}" > fastlane/play-store-credentials.json
      fi
  script:
    - bundle exec fastlane android production
  after_script:
    - rm -f android/upload-keystore.jks fastlane/play-store-credentials.json android/keystore.properties
  artifacts:
    paths:
      - android/app/build/outputs/bundle/release/
    expire_in: 30 days
  when: manual
  allow_failure: false
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  environment:
    name: production
    url: https://play.google.com/store/apps/details?id=com.bittasker.app

trigger-zapstore-release:
  stage: deploy-android
  needs:
    - job: android-release-prepare
      artifacts: true
    - job: android-release-web
      artifacts: true
  variables:
    VERSION_NAME: $VERSION_NAME
    VERSION_CODE: $VERSION_CODE
    PARENT_CI_COMMIT_TAG: $CI_COMMIT_TAG
    PARENT_PIPELINE_ID: $CI_PIPELINE_ID
  trigger:
    include:
      - local: .gitlab/ci/release-zapstore.yml
    strategy: depend
    forward:
      pipeline_variables: true
  when: manual
  allow_failure: false
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
