# Manual QVAC ops. Play them on sandbox/rgb-wasm-phase0 or dev.
# master, production, and every other branch skip these jobs.
# allow_failure keeps an unplayed job from blocking the deploy pipeline.
#
# Runner tag. GitLab does not expand variables inside tags:, so this literal
# is the only place that selects the runner. The vps runner must advertise
# the tag vps. Change it here when the runner tag changes.
# The runner executes the job in Docker with host networking. QVAC and
# Typesense listen on loopback only, so the job uses 127.0.0.1.
#
# qvac-setup and search-embed call:
#   QVAC_LOCAL_URL       default http://127.0.0.1:11434
#   TYPESENSE_LOCAL_URL  default http://127.0.0.1:8108
# Override either variable when the host or port changes. Set an origin only.
#
# Masked CI variables, required, never printed:
#   QVAC_BEARER_TOKEN
#   TYPESENSE_API_KEY (search-embed). The container does not read
#   /opt/bittasker/typesense.env.
#
# qvac-setup installs curl when the image does not have it (apt-get or apk).
# The listener is `qvac serve --openai` from services/qvac, not Ollama.
# The job prints the model names from /v1/models and one POST /api/pull error.
# It does not create an alias. When embed is missing it prints the VPS
# commands (copy qvac.config.json to /opt/bittasker/qvac and run
# scripts/qvac-restart-remote.sh) and stops. It does not use SSH.
# After the check it prints:
#   Manual step: ask BitTasker Hotfix to restart QVAC on the VPS
#
# assistant-key needs CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
# Those are referenced in .gitlab-ci.yml and docs/ci/environment-variables.md.
# The job writes the Worker secret ASSISTANT_NSEC with
# `wrangler versions secret put --env sandbox` or `--env dev`.
# That matches `npx wrangler deploy --env sandbox` and `--env dev`.
# A name flag is not passed: Wrangler would append the env and request
# bittasker-sandbox-sandbox. An existing ASSISTANT_NSEC is kept.
# The nsec is not printed.

.qvac-ops:
  stage: ops
  image: node:24-bookworm-slim
  tags:
    - vps
  interruptible: false
  allow_failure: true
  timeout: 2 hours
  variables:
    QVAC_LOCAL_URL: http://127.0.0.1:11434
    TYPESENSE_LOCAL_URL: http://127.0.0.1:8108
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
      - .npm/
    policy: pull
  environment:
    name: development
    action: prepare
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
      when: never
    - if: $CI_COMMIT_BRANCH == "sandbox/rgb-wasm-phase0"
      when: manual
    - if: $CI_COMMIT_BRANCH == "dev"
      when: manual
    - when: never

qvac-setup:
  extends: .qvac-ops
  timeout: 1 hour
  before_script:
    - bash scripts/ci-ensure-tools.sh curl
  script:
    - bash scripts/qvac-ci-setup.sh

assistant-key:
  extends: .qvac-ops
  timeout: 20 minutes
  variables:
    # Different names so GitLab 18.6 expands the project variables.
    CF_API_TOKEN: $CLOUDFLARE_API_TOKEN
    CF_ACCOUNT_ID: $CLOUDFLARE_ACCOUNT_ID
  before_script:
    - dpkg -s ca-certificates >/dev/null 2>&1 || (apt-get update -qq && apt-get install -y -qq ca-certificates && update-ca-certificates)
  script:
    - npm ci --cache .npm --prefer-offline
    - bash scripts/qvac-ci-assistant-key.sh

search-embed:
  extends: .qvac-ops
  before_script:
    - dpkg -s ca-certificates >/dev/null 2>&1 || (apt-get update -qq && apt-get install -y -qq ca-certificates && update-ca-certificates)
  script:
    - npm ci --cache .npm --prefer-offline
    - bash scripts/qvac-ci-search-embed.sh
