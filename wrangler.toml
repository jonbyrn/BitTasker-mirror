name = "bittasker-dev-worker"
main = "workers-site/index.js"
compatibility_date = "2026-05-11"
account_id = "0e47af3ee55b77b43b150879938ebbec"
#account_id = "3fa48b084b262faa8a164ab089d702b6"

# ============================================
# OBSERVABILITY CONFIGURATION
# ============================================
# Workers Logs: Automatically collects invocation logs, custom logs, errors, and uncaught exceptions
# Available in Cloudflare Dashboard > Workers & Pages > Your Worker > Logs
# 
# head_sampling_rate: Percentage of requests to log (0.0 to 1.0)
# - 1.0 = 100% sampling (recommended for dev/staging)
# - 0.1 = 10% sampling (recommended for production to reduce cost)
# - 0.01 = 1% sampling (high-traffic production)
[observability.logs]
enabled = true
head_sampling_rate = 1.0  # 100% sampling for dev/staging (full visibility)

# ============================================
# PERFORMANCE LIMITS
# ============================================
# CPU Time Limits:
# - Free Plan: 10ms per request
# - Paid Plan: 30s default (configurable up to 5 min)
# - Wall-clock time is unlimited
#
# Defaults are sufficient for static content. Raise only if needed.
# [limits]
# cpu_ms = 30_000  # 30 seconds

# ============================================
# STATIC ASSETS CONFIGURATION (Workers Static Assets)
# ============================================
# Workers Sites ([site]) is deprecated in Wrangler v4.
# Static Assets serves files directly from Cloudflare's edge cache
# with automatic SPA fallback for client-side routing.
[assets]
directory = "./build"
binding = "ASSETS"
not_found_handling = "single-page-application"
# API routes run through the Worker for Stream upload/token endpoints.
# __data.json patterns cover SvelteKit client-side navigation preload.
# Static assets bypass the Worker entirely — served directly from Cloudflare's
# edge cache, faster and free (unlimited requests, no Worker billing).
run_worker_first = [
    "/api/*",
    "/__data.json",
    "/*/__data.json",
    "/*/*/__data.json",
    "/*/*/*/__data.json"
]

# ============================================
# KV NAMESPACES (Cloudflare Stream)
# ============================================
# Non-inheritable — defined per-environment below.
# Created via: wrangler kv namespace create VIDEO_STATUS / VIDEO_AUTH

# ============================================
# DEV Environment (default)
# ============================================
[env.dev]
name = "bittasker-dev-worker"
workers_dev = false

[env.dev.route]
pattern = "worker.dev.bittasker.com/*"
# Replace with actual zone ID if needed
zone_id = "2f577970e10b49266dbfc1ff6c5c8dc4"

[env.dev.observability.logs]
enabled = true
head_sampling_rate = 1.0

# Cloudflare Stream binding — direct upload URLs + signed token generation
[env.dev.stream]
binding = "STREAM"

[[env.dev.kv_namespaces]]
binding = "VIDEO_STATUS"
id = "096ca6be2d3b4b7db628f57fdba1dd21"

[[env.dev.kv_namespaces]]
binding = "VIDEO_AUTH"
id = "e3ebf37679584874a2a673bcb002e8f1"

[env.dev.triggers]
crons = ["0 3 * * 0"]  # Sunday 3am UTC — abandoned upload cleanup

[env.dev.vars]
VITE_CLIENT_URL = "https://worker.dev.bittasker.com/"
VITE_NOSTR_RELAY_URL = "wss://relay.bittasker.hedgehackers.finance"
VITE_NOSTR_RELAY_NESTJS = "https://relay.bittasker.com"
VITE_RSK_NETWORK = "mainnet"
VITE_BSC_NETWORK = "mainnet"
VITE_STREAM_CUSTOMER_CODE = "customer-h1uh9jc2wp9hnxue"

