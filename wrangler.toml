name = "bittasker-dev-worker"
main = "workers-site/index.js"
compatibility_date = "2025-10-07"
account_id = "0e47af3ee55b77b43b150879938ebbec"

# Logs are enabled for troubleshooting purposes
[observability.logs]
enabled = true

[site]
bucket = "./build"

# ============================================
# STAGING Environment (default)
# ============================================
# Worker: bittasker-dev-worker
# Deploy with: npm run deploy:workers
[env.staging]
name = "bittasker-dev-worker"

[env.staging.vars]
VITE_CLIENT_URL = "https://worker.dev.bittasker.com/"
VITE_NOSTR_RELAY_URL = "wss://relay.bittasker.hedgehackers.finance"
VITE_NOSTR_RELAY_NESTJS = "https://relay.bittasker.com"
VITE_RSK_NETWORK = "mainnet"
VITE_BSC_NETWORK = "mainnet"
VITE_BOLTZ_NETWORK="mainnet"

# ============================================
# PRODUCTION Environment
# ============================================
# Worker: bittasker-prod-worker
# Deploy with: npm run deploy:workers:production
[env.production]
name = "bittasker-prod-worker"

[env.production.vars]
VITE_CLIENT_URL = "https://worker.prod.bittasker.com/"
VITE_NOSTR_RELAY_URL = "wss://relay1.bittasker.com"
VITE_NOSTR_RELAY_NESTJS = "https://relay2.bittasker.com"
VITE_RSK_NETWORK = "testnet"
VITE_BSC_NETWORK = "testnet"
