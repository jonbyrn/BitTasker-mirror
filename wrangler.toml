name = "bittasker-dev-worker"
main = "workers-site/index.js"
compatibility_date = "2025-10-07"
account_id = "0e47af3ee55b77b43b150879938ebbec"

# ============================================
# OBSERVABILITY CONFIGURATION
# ============================================
# Workers Logs: Automatically collects invocation logs, custom logs, errors, and uncaught exceptions
# Available in Cloudflare Dashboard > Workers & Pages > Your Worker > Logs
# 
# head_sampling_rate: Percentage of requests to log (0.0 to 1.0)
# - 1.0 = 100% of requests logged (recommended for dev/staging)
# - 0.1 = 10% of requests logged (recommended for production to reduce costs)
# - 0.01 = 1% of requests logged (for high-traffic production)
[observability.logs]
enabled = true
head_sampling_rate = 1.0  # 100% sampling for dev/staging (full visibility)

# ============================================
# PERFORMANCE LIMITS
# ============================================
# CPU Time Limits:
# - Free Plan: 10ms per request
# - Paid Plan: 30s default, configurable up to 5 minutes (300,000ms)
# - Wall-clock time (including network I/O) is unlimited
# 
# For static site serving, default limits are sufficient
# Setting to 30 seconds (default for paid plan) - sufficient for static file serving
# Increase only if doing compute-intensive operations
[limits]
cpu_ms = 30_000  # 30 seconds (default for paid plan)

# ============================================
# SITE CONFIGURATION
# ============================================
[site]
bucket = "./build"

# ============================================
# DEV Environment (default)
# ============================================
# Worker: bittasker-dev-worker
# Deploy with: npm run deploy:workers
[env.dev]
name = "bittasker-dev-worker"

# Dev Observability: Full logging for debugging
[env.dev.observability.logs]
enabled = true
head_sampling_rate = 1.0  # 100% - full visibility for dev

[env.dev.vars]
VITE_CLIENT_URL = "https://worker.dev.bittasker.com/"
VITE_NOSTR_RELAY_URL = "wss://relay.bittasker.hedgehackers.finance"
VITE_NOSTR_RELAY_NESTJS = "https://relay.bittasker.com"
VITE_RSK_NETWORK = "mainnet"
VITE_BSC_NETWORK = "mainnet"

# ============================================
# STAGING Environment
# ============================================
# Worker: bittasker-staging-worker
# Deploy with: npm run deploy:workers:production
[env.staging]
name = "staging"

# Staging Observability: Full logging for debugging
[env.staging.observability.logs]
enabled = true
head_sampling_rate = 1.0  # 100% - full visibility for staging

[env.staging.vars]
VITE_CLIENT_URL = "https://staging.bittasker.com/"
VITE_NOSTR_RELAY_URL = "wss://relay1.bittasker.com"
VITE_NOSTR_RELAY_NESTJS = "https://relay2.bittasker.com"
VITE_RSK_NETWORK = "mainnet"
VITE_BSC_NETWORK = "mainnet"

# ============================================
# PRODUCTION Environment
# ============================================
# Worker: bittasker-prod-worker
# Deploy with: npm run deploy:workers:production
[env.production]
name = "bittasker-prod-worker"

# Production Observability: Optimized sampling for cost efficiency
# 10% sampling provides good coverage while managing costs
# Adjust based on traffic volume and budget
[env.production.observability.logs]
enabled = true
head_sampling_rate = 0.1  # 10% - balanced visibility and cost

[env.production.vars]
VITE_CLIENT_URL = "https://worker.prod.bittasker.com/"
VITE_NOSTR_RELAY_URL = "wss://relay1.bittasker.com"
VITE_NOSTR_RELAY_NESTJS = "https://relay2.bittasker.com"
VITE_RSK_NETWORK = "mainnet"
VITE_BSC_NETWORK = "mainnet"

# ============================================
# METRICS & ANALYTICS
# ============================================
# Metrics are automatically collected and available in:
# Cloudflare Dashboard > Workers & Pages > Your Worker > Metrics
#
# Available Metrics:
# - Request success/error rates
# - Invocation statuses (ok, exception, exceeded_cpu, etc.)
# - Wall time per execution (elapsed time from start to completion)
# - Subrequests (cached vs uncached responses from fetch() calls)
# - CPU time per execution
# - Error rates grouped by invocation status
#
# No additional configuration needed - metrics are collected automatically
# Use the dashboard to view graphs, histograms, and version comparisons

# ============================================
# LOGPUSH CONFIGURATION (Optional)
# ============================================
# To send logs to external destinations (R2, S3, Datadog, etc.):
# 1. Configure via Cloudflare Dashboard: Logpush > Create Logpush job
# 2. Select "Workers trace events" dataset
# 3. Choose destination (R2, S3, or supported logging provider)
#
# Or use Wrangler CLI:
# wrangler logpush create --dataset=workers_trace_events --destination=<destination>
#
# Useful for:
# - Long-term log retention
# - Integration with external monitoring tools
# - Compliance and audit requirements
# - Custom log analysis pipelines

# ============================================
# TAIL WORKERS (Optional - Beta)
# ============================================
# Tail Workers allow custom filtering, sampling, and transformation of telemetry data
# Available on Workers Paid and Enterprise tiers
# 
# To configure:
# 1. Create a Worker to serve as the Tail Worker
# 2. Add a tail() handler that processes producer Worker execution data
# 3. Configure in wrangler.toml or via dashboard
#
# Useful for:
# - Custom alerting logic
# - Real-time log processing
# - Sending filtered events to external systems
# - Advanced analytics and debugging
