# Nostr Search Relay Service for BitTasker
name = "bittasker-search-relay-jc"

# Use a recent date for the latest features
compatibility_date = "2024-05-01"

# Main entry point for the search relay service
main = "src/search-relay.js"

# Environment variables
[vars]
RELAY_NAME = "BitTasker Search Relay"
RELAY_DESCRIPTION = "NIP-50 search relay for BitTasker platform"
RELAY_PUBKEY = "your-search-relay-pubkey-here"
RELAY_CONTACT = "contact@bittasker.com"
