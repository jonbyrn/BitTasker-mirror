# Nostr Relay Service for BitTasker
name = "bittasker-relay-1"

# Use a recent date for the latest features
compatibility_date = "2024-05-01"

# Main entry point for the relay service
main = "src/index.js"

# Environment variables
[vars]
RELAY_NAME = "BitTasker Relay"
RELAY_DESCRIPTION = "Nostr relay service for BitTasker platform"
RELAY_PUBKEY = "your-relay-pubkey-here"
RELAY_CONTACT = "contact@bittasker.com"