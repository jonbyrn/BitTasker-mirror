[phases.setup]
nixPkgs = ['nodejs_22']

[phases.install]
cmds = [
    'npm cache clean --force',
    'rm -f package-lock.json',
    'rm -rf node_modules',
    'npm install --platform=linux --arch=x64 --include=optional'
]

[phases.build]
cmds = [
    'npm run build'
]

[start]
cmd = 'npm run preview'

[variables]
NODE_ENV = 'production'
npm_config_target_platform = 'linux'
npm_config_target_arch = 'x64'