apply plugin: 'com.android.application'

def isReleaseGradleTask = {
    gradle.startParameter.taskNames.any { taskName ->
        taskName.toLowerCase().contains('release')
    }
}

def isCiBuild = {
    def ci = System.getenv("CI")
    ci != null && !ci.isBlank() && ci.toLowerCase() != "false"
}

def resolveAndroidVersionCode = {
    def env = System.getenv("VERSION_CODE")
    if (env != null && !env.isBlank()) {
        def code = env.toLong()
        if (code > Integer.MAX_VALUE) {
            def offset = System.getenv("ANDROID_PIPELINE_OFFSET")?.toLong() ?: 2_400_000_000L
            code = code - offset
            if (code <= 0 || code > Integer.MAX_VALUE) {
                throw new GradleException(
                    "VERSION_CODE ${env} is invalid for Android (max ${Integer.MAX_VALUE}). " +
                    "Adjust ANDROID_PIPELINE_OFFSET (currently ${offset})."
                )
            }
        }
        return (int) code
    }
    if (isReleaseGradleTask() && isCiBuild()) {
        throw new GradleException("VERSION_CODE environment variable is required for release builds in CI")
    }
    return 1
}

def resolveAndroidVersionName = {
    def env = System.getenv("VERSION_NAME")
    if (env != null && !env.isBlank()) {
        return env
    }
    if (isReleaseGradleTask() && isCiBuild()) {
        throw new GradleException("VERSION_NAME environment variable is required for release builds in CI")
    }
    return "0.0.0-dev"
}

// Load keystore properties
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "com.bittasker.app"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.bittasker.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode resolveAndroidVersionCode()
        versionName resolveAndroidVersionName()
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~:!*.gz'
        }
        
        // Configure multiple ABIs
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }
    
    // Configure signing
    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['storeFile'])
                if (keystoreProperties['storeType']) {
                    storeType keystoreProperties['storeType']
                }
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
        debug {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['storeFile'])
                if (keystoreProperties['storeType']) {
                    storeType keystoreProperties['storeType']
                }
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    
    buildTypes {
        release {
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.debug
            }
        }
    }
    
    // Generate universal APK (supports all devices)
    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a', 'armeabi-v7a'
            universalApk true
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
    
    // Firebase dependencies for push notifications
    implementation 'com.google.firebase:firebase-messaging:23.4.0'

    // Required by capacitor-webauthn (and any Credential Manager usage) to
    // route passkey / FIDO2 requests through Google Play Services on Android.
    // Without this, R8 strips the ServiceLoader provider registration and
    // CredentialManager throws "no provider dependencies found" at runtime.
    implementation "androidx.credentials:credentials:1.5.0"
    implementation "androidx.credentials:credentials-play-services-auth:1.5.0"
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
