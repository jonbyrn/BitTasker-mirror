# GitLab CI/CD for BitTasker
#
# ═══════════════════════════════════════════════════════════════════════════════
# DEPLOYMENT STRATEGY: WORKERS PRIMARY
# ═══════════════════════════════════════════════════════════════════════════════
#
# Cloudflare Workers is the PRIMARY deployment method for frontend.
# Static assets served via Workers Static Assets ([assets] in wrangler.toml).
#
#   Workers (Primary):
#     - dev         → dev.bittasker.com (branch: dev)
#     - production  → bittasker.com (branch: master)
#     - sandbox     → rgb.bittasker.com (branch: sandbox/rgb-wasm-phase0 only)
#     - preview     → <alias>-bittasker-sandbox.<subdomain>.workers.dev
#                     (feature/*, fix/*, cursor/*; the live route is not moved)
#     - Builds and deploys via GitLab CI (this file)
#
#   Preview Deployments:
#     - feature/*, fix/*, and cursor/* only. Never sandbox, dev, or master.
#     - `wrangler versions upload --env sandbox --preview-alias <alias>`
#     - Does not run `wrangler deploy` or `wrangler triggers deploy`.
#
# ═══════════════════════════════════════════════════════════════════════════════
# ENVIRONMENT VARIABLES
# ═══════════════════════════════════════════════════════════════════════════════
#
# GitLab CI/CD supports ENVIRONMENT-SCOPED VARIABLES:
#   - Create VITE_API_URL with scope "development" → https://api-dev.bittasker.com
#   - Create VITE_API_URL with scope "production" → https://api.bittasker.com
#   - Jobs with environment: development get dev values
#   - Jobs with environment: production get prod values
#
# See docs/ci/environment-variables.md for setup instructions.
#
# ═══════════════════════════════════════════════════════════════════════════════
# STAGES
# ═══════════════════════════════════════════════════════════════════════════════
#   validate         → build + coverage. Dev/prod/preview builds (branch-dependent).
#   android-prepare  → production tag version resolve (auto on vX.Y.Z)
#   build-android    → Android APK/AAB builds
#   deploy           → Workers deploy (dev, production, and preview branches)
#   deploy-android   → Play Store + Zapstore releases (manual gates)
#   backup         → db-backup (scheduled pipelines only)
#
# ═══════════════════════════════════════════════════════════════════════════════
# RUNNERS
# ═══════════════════════════════════════════════════════════════════════════════
#   All jobs use tags: [self-hosted] so the pipeline runs on your self-hosted GitLab runner.
#
# ═══════════════════════════════════════════════════════════════════════════════
# CACHE
# ═══════════════════════════════════════════════════════════════════════════════
#   Key from package-lock.json so the same lockfile reuses cache across branches and MRs.
# ═══════════════════════════════════════════════════════════════════════════════
workflow:
  auto_cancel:
    on_new_commit: interruptible

stages:
  - validate
  - android-prepare
  - build-android
  - deploy
  - deploy-android
  - backup

# ============================================
# WORKERS BUILD/DEPLOY (PRIMARY)
# ============================================
# Workers is the primary deployment method for all environments.
# Routes are configured in wrangler.toml (dev.bittasker.com, rgb.bittasker.com, bittasker.com).
#
# These jobs use GitLab's environment-scoped variables:
#   - Jobs with environment: development get VITE_* scoped to "development"
#   - Jobs with environment: production get VITE_* scoped to "production"
#
# Preview deployments: feature/*, fix/*, and cursor/* upload a sandbox
# version with `wrangler versions upload --env sandbox`. The preview URL is
# https://<alias>-bittasker-sandbox.<subdomain>.workers.dev. The upload does
# not attach rgb.bittasker.com.
#
# To configure environment-scoped variables in GitLab:
#   Settings → CI/CD → Variables → Add variable → Set "Environment scope"
# ============================================

# ============================================
# BUILD - Development build (dev branch only)
# ============================================
build-development:
  image: node:24-bookworm-slim
  stage: validate
  interruptible: true
  tags:
    - self-hosted
  environment:
    name: development
  variables:
    SENTRY_URL: https://gt.bittasker.com
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
      - .npm/
    policy: pull-push
  before_script:
    - dpkg -s ca-certificates > /dev/null 2>&1 || (apt-get update -qq && apt-get install -y -qq ca-certificates && update-ca-certificates)
  script:
    - npm ci --cache .npm --prefer-offline
    # Bake the RGB USDT asset when GitLab has not set one. Leave API and
    # relay variables on the development scope (api-dev, relay1-dev, relay2-dev)
    # so existing dev users keep their tasks, profiles, and messages.
    - |
      export VITE_RGB_USDT_ASSET_ID="${VITE_RGB_USDT_ASSET_ID:-rgb:2s69152-rg39309-8438210-usdt_testnet}"
      npm run build:dev
  artifacts:
    paths:
      - build/
      - .svelte-kit/output/
    expire_in: 1 hour
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH == "dev"

# ============================================
# BUILD-PRODUCTION - Production build (master branch only)
# ============================================
build-production:
  image: node:24-bookworm-slim
  stage: validate
  interruptible: true
  tags:
    - self-hosted
  environment:
    name: production
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
      - .npm/
    policy: pull-push
  before_script:
    - dpkg -s ca-certificates > /dev/null 2>&1 || (apt-get update -qq && apt-get install -y -qq ca-certificates && update-ca-certificates)
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run build:production
  artifacts:
    paths:
      - build/
      - .svelte-kit/output/
    expire_in: 1 hour
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH == "master"

# ============================================
# COVERAGE - MR only (quality gate)
# ============================================
# Runs unit tests with coverage and reports to GitLab so the MR shows coverage percentage.
# Runs on merge_request_event only — no duplicate test runs on branch pushes.
coverage:
  image: node:24-bookworm-slim
  stage: validate
  interruptible: true
  tags:
    - self-hosted
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
      - .npm/
    policy: pull
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run test:ci -- --coverage
  environment:
    name: development
  coverage: '/All files[^|]*\|[^|]*\|[^|]*\|[^|]*\|\s*(\d+\.?\d*)%?/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml
    paths:
      - coverage/
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
