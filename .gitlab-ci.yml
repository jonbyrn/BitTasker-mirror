# ============================================
# DEPLOY DEVELOPMENT (worker.dev.bittasker.com)
# ============================================
# Reuses build/ artifact (no rebuild). Needs only build until Playwright is re-enabled.
# Requires: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID.
deploy-development:
  image: node:22-bookworm-slim
  stage: deploy
  tags:
    - self-hosted
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
      - .npm/
    policy: pull
  needs:
    - build
    # - service-quote-gates
    # - service-quote-e2e
  script:
    - npm ci --cache .npm --prefer-offline
    - npx wrangler deploy --env dev
    - ENVIRONMENT=dev node scripts/purge-cache.js
  environment:
    name: development
    url: https://worker.dev.bittasker.com
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"

