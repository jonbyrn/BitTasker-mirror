# ============================================
# DEPLOY DEVELOPMENT (worker.dev.bittasker.com)
# ============================================
deploy-development:
  image: node:24-bookworm-slim
  stage: deploy
  interruptible: true
  tags:
    - self-hosted
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
      - .npm/
    policy: pull
  needs:
    - build-development
  variables:
    CLOUDFLARE_API_TOKEN:
      value: $CLOUDFLARE_API_TOKEN
      expand: false
    CLOUDFLARE_ACCOUNT_ID:
      value: $CLOUDFLARE_ACCOUNT_ID
      expand: false
    SENTRY_URL: https://gt.bittasker.com
  before_script:
    - dpkg -s ca-certificates > /dev/null 2>&1 || (apt-get update -qq && apt-get install -y -qq ca-certificates && update-ca-certificates)
  script:
    - npm ci --cache .npm --prefer-offline
    - npx wrangler deploy --env dev
    - ENVIRONMENT=dev node scripts/purge-cache.js
  environment:
    name: development
    url: https://dev.bittasker.com
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH == "dev"

# ============================================
# DEPLOY SANDBOX (rgb.bittasker.com)
# Branch sandbox/rgb-wasm-phase0 only. Does not use the development
# environment, so GitLab does not inject relay1-dev into this build.
# ============================================
deploy-sandbox:
  image: node:24-bookworm-slim
  stage: deploy
  interruptible: true
  tags:
    - self-hosted
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
      - .npm/
    policy: pull
  variables:
    CLOUDFLARE_API_TOKEN:
      value: $CLOUDFLARE_API_TOKEN
      expand: false
    CLOUDFLARE_ACCOUNT_ID:
      value: $CLOUDFLARE_ACCOUNT_ID
      expand: false
    VITE_CLIENT_HOSTNAME: rgb.bittasker.com
    VITE_NOSTR_RELAY_URL: wss://nos.lol
    VITE_NOSTR_TASK_RELAY_URL: wss://relay.primal.net
    VITE_NOSTR_RELAY_NESTJS: https://api-staging.bittasker.com
    VITE_API_URL: https://api-staging.bittasker.com
    VITE_API_BASE_URL: https://api-staging.bittasker.com
    VITE_RGB_USDT_ASSET_ID: rgb:2s69152-rg39309-8438210-usdt_testnet
  before_script:
    - dpkg -s ca-certificates > /dev/null 2>&1 || (apt-get update -qq && apt-get install -y -qq ca-certificates && update-ca-certificates)
  script:
    - npm ci --cache .npm --prefer-offline
    - export VITE_CLIENT_HOSTNAME=rgb.bittasker.com
    - export VITE_RGB_USDT_ASSET_ID=rgb:2s69152-rg39309-8438210-usdt_testnet
    - export VITE_NOSTR_RELAY_URL=wss://nos.lol
    - export VITE_NOSTR_TASK_RELAY_URL=wss://relay.primal.net
    - export VITE_NOSTR_RELAY_NESTJS=https://api-staging.bittasker.com
    - export VITE_API_URL=https://api-staging.bittasker.com
    - export VITE_API_BASE_URL=https://api-staging.bittasker.com
    - npm run build:dev
    - npx wrangler deploy --env sandbox
    - ENVIRONMENT=sandbox node scripts/purge-cache.js
  environment:
    name: sandbox
    url: https://rgb.bittasker.com
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH == "sandbox/rgb-wasm-phase0"

# ============================================
# DEPLOY PRODUCTION (worker.prod.bittasker.com)
# ============================================
deploy-production:
  image: node:24-bookworm-slim
  stage: deploy
  interruptible: true
  tags:
    - self-hosted
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
      - .npm/
    policy: pull
  needs:
    - build-production
  variables:
    CLOUDFLARE_API_TOKEN:
      value: $CLOUDFLARE_API_TOKEN
      expand: false
    CLOUDFLARE_ACCOUNT_ID:
      value: $CLOUDFLARE_ACCOUNT_ID
      expand: false
  before_script:
    - dpkg -s ca-certificates > /dev/null 2>&1 || (apt-get update -qq && apt-get install -y -qq ca-certificates && update-ca-certificates)
  script:
    - npm ci --cache .npm --prefer-offline
    - npx wrangler deploy --env production
    - ENVIRONMENT=production node scripts/purge-cache.js
  environment:
    name: production
    url: https://worker.prod.bittasker.com
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH == "master"

