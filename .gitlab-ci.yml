# GitLab CI/CD for BitTasker - Cloudflare Workers Deployment
#
# -----------------------------------------------------------------------------------------------
# STAGES
# -----------------------------------------------------------------------------------------------
#   validate  → unit tests (optional, commented) + Playwright E2E (full ordered suite)
#   deploy    → deploy-development (active), deploy-staging / deploy-production (commented)
#
# -----------------------------------------------------------------------------------------------
# BRANCH STRATEGY (see also "After merging feat/workers-deployment" below)
# -----------------------------------------------------------------------------------------------
#   - feat/workers-deployment → validate (E2E) + deploy to development (worker.dev.bittasker.com)
#   - dev                     → validate (E2E); deploy-staging commented out
#   - main                    → validate (E2E); deploy-production commented out
#   - Merge requests          → validate (E2E) only
#   - Other branches          → no pipeline (add rules if you want E2E on every branch)
#
# After merging feat/workers-deployment:
#   - Recommended: Run E2E on dev + main + MRs only (not every branch) to keep feedback fast.
#   - Deploy dev: trigger on "dev" branch so each push to dev deploys to worker.dev.bittasker.com.
#   - Change deploy-development rules from "feat/workers-deployment" to "dev" when you switch.
#
# Wrangler: GitLab injects CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID from CI/CD Variables.
# Build-time VITE_* must be set in GitLab so "npm run build" bakes them into the client bundle.
#
# CI/CD Variables for E2E:
#   - VITE_API_URL             (required) — backend API for signup/onboarding/passkey
#   - VITE_E2E_TURNSTILE_BYPASS = true    — bypass Turnstile in E2E (optional; script may warn)
#   - VITE_NOSTR_RELAY_URL      (required for 04-messages) — Nostr relay for Messages E2E
# -----------------------------------------------------------------------------------------------
stages:
  - validate
  - deploy

# ============================================
# VALIDATE - Unit tests (COMMENTED)
# ============================================
# Uncomment to run Vitest CI tests before E2E. When uncommented, add "validate" to playwright needs if you want E2E to run after unit tests.
# validate:
#   image: node:22-bookworm-slim
#   stage: validate
#   cache:
#     key: $CI_COMMIT_REF_SLUG
#     paths:
#       - node_modules/
#       - .npm/
#   script:
#     - npm ci --cache .npm --prefer-offline
#     #- npm run check
#     #- npm run lint
#     - npm run test:ci
#     #- npm run build
#   artifacts:
#     paths:
#       - build/
#     expire_in: 1 hour

# ============================================
# PLAYWRIGHT E2E - Full ordered suite (validate stage)
# ============================================
# Runs: 01-signup-onboarding (credentials) then 02, 03, 04 (credentials-login, wallet, messages).
# Uses scripts/e2e-ordered.js via "npm run test:e2e". In CI, Playwright runs build+preview (playwright.config).
# Requires VITE_API_URL and, for 04-messages, VITE_NOSTR_RELAY_URL in CI/CD Variables.
playwright:
  image: mcr.microsoft.com/playwright:v1.54.0-noble
  stage: validate
  cache:
    key: $CI_COMMIT_REF_SLUG
    paths:
      - node_modules/
      - .npm/
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run test:e2e
  environment:
    name: development
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "feat/workers-deployment"
    - if: $CI_COMMIT_BRANCH == "dev"
    - if: $CI_COMMIT_BRANCH == "main"

# ============================================
# DEPLOY DEVELOPMENT (worker.dev.bittasker.com)
# ============================================
# Active. Runs on feat/workers-deployment for now; after merge, change rules to "dev" if you want dev branch to deploy here.
# Requires: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, and dev VITE_* in CI/CD Variables.
# If variables are Protected, uncheck Protected or protect the branch so they are injected.
deploy-development:
  image: node:22-bookworm-slim
  stage: deploy
  cache:
    key: $CI_COMMIT_REF_SLUG
    paths:
      - node_modules/
      - .npm/
  needs:
    - playwright
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run build
    - npx wrangler deploy --env dev
    - ENVIRONMENT=dev node scripts/purge-cache.js
  environment:
    name: development
    url: https://worker.dev.bittasker.com
  rules:
    - if: $CI_COMMIT_BRANCH == "feat/workers-deployment"

