# ============================================
# DEPLOY DEVELOPMENT (worker.dev.bittasker.com)
# ============================================
deploy-development:
  image: node:22-bookworm-slim
  stage: deploy
  interruptible: true
  tags:
    - self-hosted
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
      - .npm/
    policy: pull
  needs:
    - build
  script:
    - npm ci --cache .npm --prefer-offline
    - npx wrangler deploy --env dev
    - ENVIRONMENT=dev node scripts/purge-cache.js
  environment:
    name: development
    url: https://worker.dev.bittasker.com
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"

# ============================================
# DEPLOY PRODUCTION (bittasker.com via Workers)
# ============================================
deploy-production:
  image: node:22-bookworm-slim
  stage: deploy
  interruptible: true
  tags:
    - self-hosted
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
      - .npm/
    policy: pull
  needs:
    - build-production
  script:
    - npm ci --cache .npm --prefer-offline
    - npx wrangler deploy --env production
    - ENVIRONMENT=production node scripts/purge-cache.js
  environment:
    name: production
    url: https://worker.prod.bittasker.com
  rules:
    - if: $CI_COMMIT_BRANCH == "master"

# ═══════════════════════════════════════════════════════════════════════════════
# BACKUP — Database backups to Cloudflare R2 (scheduled pipelines only)
# ═══════════════════════════════════════════════════════════════════════════════
#
# Runs pg_dump for all three Railway PostgreSQL databases and uploads to
# Cloudflare R2 under RETENTION_TYPE prefix (daily/weekly/monthly).
#
# Three GitLab pipeline schedules trigger this job:
#   - Daily   → RETENTION_TYPE=daily,   cron: 0 3 * * *
#   - Weekly  → RETENTION_TYPE=weekly,  cron: 0 3 * * 0
#   - Monthly → RETENTION_TYPE=monthly, cron: 0 3 1 * *
#
# Required CI/CD variables (set in GitLab → Settings → CI/CD → Variables):
#   CLOUDFLARE_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_BUCKET
#   PG_HOST_API, PG_HOST_RELAY_TASKS, PG_HOST_RELAY_GENERAL
#   PGUSER_BACKUP, PGPASSWORD_BACKUP
#
# See docs/ci/server-backup.md for full setup instructions.
# ═══════════════════════════════════════════════════════════════════════════════
db-backup:
  image: postgres:16-alpine
  stage: backup
  tags:
    - self-hosted
  before_script:
    - apk add --no-cache python3 py3-pip
    - pip3 install --break-system-packages --quiet awscli
  script:
    - bash scripts/backup-databases.sh
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  environment:
    name: production

# ═══════════════════════════════════════════════════════════════════════════════
# ANDROID — Google Play Store release pipeline (fastlane)
# ═══════════════════════════════════════════════════════════════════════════════
#
# Internal testing: push v*-alpha* or v*-beta* tag on master → auto-deploy.
# Production: push vX.Y.Z tag on master → manual gate (click play to release).
#
# Required CI/CD variables (set in GitLab → Settings → CI/CD → Variables):
#   ANDROID_KEYSTORE_BASE64 — upload-keystore.jks base64-encoded (binary can't be a raw string var)
#   ANDROID_KEYSTORE_STORE_PASSWORD, ANDROID_KEYSTORE_KEY_ALIAS, ANDROID_KEYSTORE_KEY_PASSWORD
#   PLAY_STORE_CREDENTIALS_JSON — Google service account JSON (multi-line string var)
#
# Secrets are cleaned up in after_script (never stored in artifacts or on the runner).
#
# See docs/ci/play-store-pipeline.md for full setup instructions.
# ═══════════════════════════════════════════════════════════════════════════════

# Gradle cache — speeds up Android builds by caching dependencies
.android-cache:
  cache:
    - key:
        files:
          - android/build.gradle
          - android/app/build.gradle
      paths:
        - .gradle/caches/
      policy: pull-push
    - key:
        files:
          - android/gradle/wrapper/gradle-wrapper.properties
      paths:
        - .gradle/wrapper/
      policy: pull-push

# ─── Android: Internal Testing (v*-alpha* or v*-beta* tag on master) ────────
# Uses $CI_PIPELINE_ID as versionCode (always unique, always increasing).
# versionName from tag (auto, no manual gate).
# Decode upload keystore from base64 CI variable (binary can't be stored as raw string)
# Generate keystore.properties from CI variables
# Write service account credentials from CI variable
android-build-internal:
  extends: .android-cache
  stage: build-android
  image: reactnativecommunity/react-native-android:latest
  tags:
    - self-hosted
  variables:
    VERSION_CODE: $CI_PIPELINE_ID
  before_script:
    - |
      export VERSION_NAME="${CI_COMMIT_TAG#v}"
      echo "Internal testing build: versionName=$VERSION_NAME versionCode=$VERSION_CODE"
      apt-get update -qq && apt-get install -y -qq --no-install-recommends ruby-full ruby-dev build-essential
      gem install bundler -v '~>2.5' --no-document
      bundle install --quiet
      echo "${ANDROID_KEYSTORE_BASE64}" | base64 -d > android/upload-keystore.jks
      cat > android/keystore.properties << EOF
      storeFile=upload-keystore.jks
      storePassword=${ANDROID_KEYSTORE_STORE_PASSWORD}
      keyAlias=${ANDROID_KEYSTORE_KEY_ALIAS}
      keyPassword=${ANDROID_KEYSTORE_KEY_PASSWORD}
      EOF
      echo "${PLAY_STORE_CREDENTIALS_JSON}" > fastlane/play-store-credentials.json
  script:
    - bundle exec fastlane android internal
  after_script:
    - rm -f android/upload-keystore.jks fastlane/play-store-credentials.json android/keystore.properties
  artifacts:
    paths:
      - android/app/build/outputs/bundle/release/
    expire_in: 7 days
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+-(alpha|beta)/
  environment:
    name: internal-testing

# ─── Android: Production release (manual gate, tag vX.Y.Z on master only) ──
# versionCode is auto-incremented by fastlane (increment_version_code) and
# committed back to the repo. versionName comes from the git tag.
# Enforces that the tag is an ancestor of master before building.
# ── Guard: tag must be on master ───────────────────────────────────────
# ── versionName from tag ────────────────────────────────────────────────
# ── Install Ruby + fastlane ─────────────────────────────────────────────
# Decode upload keystore from base64 CI variable (binary can't be stored as raw string)
# ── Generate signing config from CI variables ───────────────────────────
# ── Write Play Store credentials ────────────────────────────────────────
android-release-production:
  extends: .android-cache
  stage: deploy-android
  image: reactnativecommunity/react-native-android:latest
  tags:
    - self-hosted
  before_script:
    - |
      if ! git merge-base --is-ancestor "$CI_COMMIT_TAG" origin/master; then
        echo "ERROR: Tag $CI_COMMIT_TAG is not on master. Production releases must be tagged from master."
        exit 1
      fi
      export VERSION_NAME="${CI_COMMIT_TAG#v}"
      echo "Production release: versionName=$VERSION_NAME (versionCode auto-incremented by fastlane)"
      apt-get update -qq && apt-get install -y -qq --no-install-recommends ruby-full ruby-dev build-essential
      gem install bundler -v '~>2.5' --no-document
      bundle install --quiet
      echo "${ANDROID_KEYSTORE_BASE64}" | base64 -d > android/upload-keystore.jks
      cat > android/keystore.properties << EOF
      storeFile=upload-keystore.jks
      storePassword=${ANDROID_KEYSTORE_STORE_PASSWORD}
      keyAlias=${ANDROID_KEYSTORE_KEY_ALIAS}
      keyPassword=${ANDROID_KEYSTORE_KEY_PASSWORD}
      EOF
      echo "${PLAY_STORE_CREDENTIALS_JSON}" > fastlane/play-store-credentials.json
  script:
    - bundle exec fastlane android production
  after_script:
    - rm -f android/upload-keystore.jks fastlane/play-store-credentials.json android/keystore.properties
  artifacts:
    paths:
      - android/app/build/outputs/bundle/release/
    expire_in: 30 days
  when: manual
  allow_failure: false
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  environment:
    name: production
    url: https://play.google.com/store/apps/details?id=com.bittasker.app
