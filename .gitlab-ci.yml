# GitLab CI/CD for BitTasker
#
# ═══════════════════════════════════════════════════════════════════════════════
# DEPLOYMENT STRATEGY: PAGES PRIMARY
# ═══════════════════════════════════════════════════════════════════════════════
#
# Cloudflare Pages is the PRIMARY deployment method for frontend.
# Workers jobs are AVAILABLE but deploy to workers.dev subdomain only (no route conflicts).
#
#   Pages (Primary):
#     - dev-pages   → dev.bittasker.com (production branch: dev)
#     - prod-pages  → bittasker.com (production branch: master)
#     - Builds triggered automatically by Cloudflare on git push
#     - Environment variables configured in Cloudflare Pages dashboard
#
#   Workers (Testing/Future):
#     - Routes are DISABLED in wrangler.toml (commented out)
#     - Workers deploy to *.workers.dev subdomain only
#     - Use for testing Workers features (Stream API, Cron triggers, etc.)
#     - To migrate fully to Workers: see docs/ci/deployment-strategy.md
#
# ═══════════════════════════════════════════════════════════════════════════════
# ENVIRONMENT VARIABLES
# ═══════════════════════════════════════════════════════════════════════════════
#
# GitLab CI/CD supports ENVIRONMENT-SCOPED VARIABLES:
#   - Create VITE_API_URL with scope "development" → https://api-dev.bittasker.com
#   - Create VITE_API_URL with scope "production" → https://api.bittasker.com
#   - Jobs with environment: development get dev values
#   - Jobs with environment: production get prod values
#
# See docs/ci/environment-variables.md for setup instructions.
#
# ═══════════════════════════════════════════════════════════════════════════════
# STAGES
# ═══════════════════════════════════════════════════════════════════════════════
#   validate         → coverage (MR only). Quality gate for merge requests.
#   android-prepare  → production tag version resolve (auto on vX.Y.Z)
#   build-android    → Android APK/AAB builds
#   deploy           → Workers deploy (to workers.dev, not main domains)
#   deploy-android   → Play Store + Zapstore releases (manual gates)
#   backup         → db-backup (scheduled pipelines only)
#
# ═══════════════════════════════════════════════════════════════════════════════
# RUNNERS
# ═══════════════════════════════════════════════════════════════════════════════
#   All jobs use tags: [self-hosted] so the pipeline runs on your self-hosted GitLab runner.
#
# ═══════════════════════════════════════════════════════════════════════════════
# CACHE
# ═══════════════════════════════════════════════════════════════════════════════
#   Key from package-lock.json so the same lockfile reuses cache across branches and MRs.
# ═══════════════════════════════════════════════════════════════════════════════
workflow:
  auto_cancel:
    on_new_commit: interruptible

stages:
  - validate
  - android-prepare
  - build-android
  - deploy
  - deploy-android
  - backup

# ============================================
# WORKERS BUILD/DEPLOY
# ============================================
# Workers deploys to workers.dev subdomain ONLY (routes disabled in wrangler.toml).
# Pages handles main domains (bittasker.com, dev.bittasker.com).
#
# These jobs use GitLab's environment-scoped variables:
#   - Jobs with environment: development get VITE_* scoped to "development"
#   - Jobs with environment: production get VITE_* scoped to "production"
#
# To configure environment-scoped variables in GitLab:
#   Settings → CI/CD → Variables → Add variable → Set "Environment scope"
# ============================================

# ============================================
# BUILD - Development build (dev branch only)
# ============================================
build:
  image: node:22-bookworm-slim
  stage: validate
  interruptible: true
  tags:
    - self-hosted
  environment:
    name: development
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
      - .npm/
    policy: pull-push
  before_script:
    - dpkg -s ca-certificates > /dev/null 2>&1 || (apt-get update -qq && apt-get install -y -qq ca-certificates && update-ca-certificates)
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run build
  artifacts:
    paths:
      - build/
      - .svelte-kit/output/
    expire_in: 1 hour
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH == "dev"

# ============================================
# BUILD-PRODUCTION - Production build (master branch only)
# ============================================
build-production:
  image: node:22-bookworm-slim
  stage: validate
  interruptible: true
  tags:
    - self-hosted
  environment:
    name: production
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
      - .npm/
    policy: pull-push
  before_script:
    - dpkg -s ca-certificates > /dev/null 2>&1 || (apt-get update -qq && apt-get install -y -qq ca-certificates && update-ca-certificates)
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run build:production
  artifacts:
    paths:
      - build/
      - .svelte-kit/output/
    expire_in: 1 hour
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH == "master"

# ============================================
# COVERAGE - MR only (quality gate)
# ============================================
# Runs unit tests with coverage and reports to GitLab so the MR shows coverage percentage.
# Runs on merge_request_event only — no duplicate test runs on branch pushes.
coverage:
  image: node:22-bookworm-slim
  stage: validate
  interruptible: true
  tags:
    - self-hosted
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
      - .npm/
    policy: pull
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run test:ci -- --coverage
  environment:
    name: development
  coverage: '/All files[^|]*\|[^|]*\|[^|]*\|[^|]*\|\s*(\d+\.?\d*)%?/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml
    paths:
      - coverage/
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
