# GitLab CI/CD for BitTasker - Cloudflare Workers Deployment
#
# Branch strategy:
#   - feat/workers-deployment (or any branch matching rules below) → validate + deploy to development (worker.dev.bittasker.com)
#   - dev → validate + deploy to staging (staging.bittasker.com)
#   - main → validate + deploy to production (worker.prod.bittasker.com)
#   - Other branches → validate only (test, lint, build)
#
# How wrangler deploys from CI: GitLab injects CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID
# from CI/CD Variables into the job env; wrangler uses them (no interactive login). Build-time
# VITE_* must be set in GitLab so "npm run build" bakes them into the client bundle.

stages:
  #- validate
  - deploy

# ============================================
# VALIDATE - Runs on all branches
# ============================================
# Single test file: replace with a path that passes, or remove the path to run full suite
validate:
  image: node:22-bookworm-slim
  stage: validate
  cache:
    key: $CI_COMMIT_REF_SLUG
    paths:
      - node_modules/
      - .npm/
  script:
    - npm ci --cache .npm --prefer-offline
    #- npm run check
    #- npm run lint
    - npx vitest run src/lib/tests/ci-placeholder.test.ts
    - npm run build
  artifacts:
    paths:
      - build/
    expire_in: 1 hour

# ============================================
# DEPLOY DEVELOPMENT - test full pipeline path (worker.dev.bittasker.com)
# ============================================
# Runs on feat/workers-deployment so you can test validate + deploy without touching staging/production.
# Uses GitLab "development" environment. Requires CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID,
# and dev VITE_* in GitLab CI/CD Variables (scoped to "development" or All).
# Important: If variables are marked "Protected", they are only injected on protected branches.
# For feat/workers-deployment (unprotected), either uncheck Protected for these vars or protect the branch.
deploy-development:
  image: node:22-bookworm-slim
  stage: deploy
  cache:
    key: $CI_COMMIT_REF_SLUG
    paths:
      - node_modules/
      - .npm/
  #needs:
    #- validate
  script:
    # Optional: verify key vars are present (no values printed). Set DEBUG_CI_VARS=1 in CI to enable.
    - |
      if [ "$DEBUG_CI_VARS" = "1" ]; then
        echo "CI_VARS_CHECK: CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN:+set}"
        echo "CI_VARS_CHECK: CLOUDFLARE_ACCOUNT_ID=${CLOUDFLARE_ACCOUNT_ID:+set}"
        echo "CI_VARS_CHECK: SENTRY_AUTH_TOKEN=${SENTRY_AUTH_TOKEN:+set}"
      fi
    - npm ci --cache .npm --prefer-offline
    - npm run build
    - npx wrangler deploy --env dev
    - ENVIRONMENT=dev node scripts/purge-cache.js
  environment:
    name: development
    url: https://worker.dev.bittasker.com
  rules:
    - if: $CI_COMMIT_BRANCH == "feat/workers-deployment"

# ============================================
# DEPLOY STAGING - dev branch only
# ============================================
deploy-staging:
  image: node:22-bookworm-slim
  stage: deploy
  cache:
    key: $CI_COMMIT_REF_SLUG
    paths:
      - node_modules/
      - .npm/
  needs:
    - validate
  script:
    - npm ci --cache .npm --prefer-offline
    # Build with staging env vars (set in GitLab CI/CD variables)
    - npm run build
    - npx wrangler deploy --env staging
    - ENVIRONMENT=staging node scripts/purge-cache.js
  environment:
    name: staging
    url: https://staging.bittasker.com
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"

# ============================================
# DEPLOY PRODUCTION - main branch only
# ============================================
deploy-production:
  image: node:22-bookworm-slim
  stage: deploy
  cache:
    key: $CI_COMMIT_REF_SLUG
    paths:
      - node_modules/
      - .npm/
  needs:
    - validate
  script:
    - npm ci --cache .npm --prefer-offline
    # Build with production env vars (set in GitLab CI/CD variables)
    - npm run build:production
    - npx wrangler deploy --env production
    - ENVIRONMENT=production node scripts/purge-cache.js
  environment:
    name: production
    url: https://worker.prod.bittasker.com
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
