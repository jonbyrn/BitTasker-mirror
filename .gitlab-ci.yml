#
# ============================================
# DEPLOY PREVIEW (feature/*, fix/*, cursor/*)
# ============================================
# Re-enabled from the versions-upload job above. Fixes:
#   - `--env sandbox`, not `--env dev`, so MEILI_SEARCH_KEY and the other
#     sandbox secrets are inherited (versions upload keeps unchanged secrets).
#   - Preview alias on bittasker-sandbox. URL:
#     https://<alias>-bittasker-sandbox.<subdomain>.workers.dev
#   - The Workers token is scoped to the development environment, same as
#     deploy-sandbox. `action: prepare` reads that scope and does not record
#     a deployment of dev.bittasker.com or rgb.bittasker.com.
#   - Job variables use a different name than the project variable. GitLab
#     18.6 leaves `CLOUDFLARE_API_TOKEN: $CLOUDFLARE_API_TOKEN` unexpanded.
#   - feature/*, fix/*, and cursor/* build themselves. The Workers token is
#     protected, so GitLab only injects it on a protected branch. A pipeline
#     on sandbox/rgb-wasm-phase0 can still preview another commit by setting
#     PREVIEW_SHA (and PREVIEW_ALIAS). That path skips deploy-sandbox, so it
#     does not move rgb.bittasker.com.
#   - PREVIEW_SHA may be 7–40 hex characters. A short id is not a remote ref,
#     so the job fetches this project's branches and resolves it locally.
#     The commit must already be on GitLab. GitHub-only hotfix commits are
#     copied by the Sync to GitLab workflow (push of a branch that contains
#     that workflow, or workflow_dispatch git_ref). This job does not fetch
#     GitHub and does not embed a token.
#   - This job never calls `wrangler deploy` or `wrangler triggers deploy`.
#   - No secret is written into a VITE_* variable. Public sandbox values
#     match deploy-sandbox and override relay1-dev from the development scope.
deploy-preview:
  image: node:24-bookworm-slim
  stage: deploy
  interruptible: true
  tags:
    - self-hosted
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
      - .npm/
    policy: pull
  variables:
    CF_API_TOKEN: $CLOUDFLARE_API_TOKEN
    CF_ACCOUNT_ID: $CLOUDFLARE_ACCOUNT_ID
    VITE_CLIENT_HOSTNAME: rgb.bittasker.com
    VITE_NOSTR_RELAY_URL: wss://nos.lol
    VITE_NOSTR_TASK_RELAY_URL: wss://relay.primal.net
    VITE_NOSTR_LISTING_RELAY_URL: wss://relay.bittasker.com
    VITE_NOSTR_RELAY_NESTJS: https://api-staging.bittasker.com
    VITE_API_URL: https://api-staging.bittasker.com
    VITE_API_BASE_URL: https://api-staging.bittasker.com
    VITE_RGB_USDT_ASSET_ID: rgb:f~9F4X0C-TiLOTvy-pALF29V-2xJ2p0m-hP3_vpW-Alj4G5Y
    VITE_CLOUDFLARE_SITEKEY: 0x4AAAAAABboTbbIVmXVwEvm
    VITE_CREDIT_ENABLED: 'true'
    VITE_TEMP_STAFF_ENABLED: 'true'
    VITE_MARKET_ENABLED: 'true'
    VITE_QVAC_ENABLED: 'true'
    VITE_PARTIAL_USDT_POLICY: warn
    VITE_CHANGELLY_FIAT_ENABLED: 'true'
  before_script:
    - dpkg -s ca-certificates > /dev/null 2>&1 || (apt-get update -qq && apt-get install -y -qq ca-certificates && update-ca-certificates)
    - . scripts/ci/cloudflare-token.sh
  script:
    - |
      set -euo pipefail
      if [ -n "${PREVIEW_SHA:-}" ]; then
        case "$PREVIEW_SHA" in
          *[!0-9a-fA-F]*|"" )
            echo "PREVIEW_SHA must be a commit id."
            exit 1
            ;;
        esac
        if [ "${#PREVIEW_SHA}" -lt 7 ] || [ "${#PREVIEW_SHA}" -gt 40 ]; then
          echo "PREVIEW_SHA must be a commit id."
          exit 1
        fi
        apt-get update -qq && apt-get install -y -qq git
        PREVIEW_SHA=$(printf '%s' "$PREVIEW_SHA" | tr 'A-F' 'a-f')
        echo "Building preview of ${PREVIEW_SHA}."
        # A short id is not a ref name. Fetch the full id directly when we
        # have one. If that object is not advertised, fetch branch tips and
        # resolve the prefix locally. Never fetch a caller-supplied remote.
        if [ "${#PREVIEW_SHA}" -eq 40 ]; then
          git fetch --depth=1 origin "$PREVIEW_SHA" || true
        fi
        if ! git cat-file -e "${PREVIEW_SHA}^{commit}" >/dev/null 2>&1; then
          echo "Fetching GitLab branches to resolve ${PREVIEW_SHA}."
          git fetch origin '+refs/heads/*:refs/remotes/origin-heads/*'
        fi
        if ! full=$(git rev-parse --verify "${PREVIEW_SHA}^{commit}" 2>/tmp/preview-sha.err); then
          echo "PREVIEW_SHA ${PREVIEW_SHA} did not resolve to one commit on GitLab."
          cat /tmp/preview-sha.err || true
          echo "Push that commit to gitlab.com/bittasker/BitTasker first."
          echo "Use the Sync to GitLab workflow with git_ref set to the branch or the full 40-character id, then rerun this pipeline with that full id."
          exit 1
        fi
        case "$full" in
          "$PREVIEW_SHA"*) ;;
          *)
            echo "Resolved ${PREVIEW_SHA} to ${full}, which does not match."
            exit 1
            ;;
        esac
        echo "Resolved preview commit ${full}."
        git read-tree -u --reset "$full"
        git clean -fd -e .npm -e node_modules
        # Keep this pipeline's CI, Wrangler config, and token script.
        # The preview commit must not replace them.
        git checkout HEAD -- .gitlab-ci.yml .github wrangler.toml scripts/ci
        if [ -f src/app.html ]; then
          PREVIEW_COMMIT="$full" node --input-type=module -e 'const fs=await import("node:fs"); const sha=process.env.PREVIEW_COMMIT; const file="src/app.html"; let html=fs.readFileSync(file,"utf8"); const tag="<meta name=\"build-sha\" content=\""+sha+"\" />"; if (html.includes("name=\"build-sha\"")) { html=html.replace(/<meta\s+name="build-sha"\s+content="[^"]*"\s*\/?>/, tag); } else if (html.includes("</head>")) { html=html.replace("</head>", tag+"\n</head>"); } else { console.error("src/app.html has no head element."); process.exit(1); } fs.writeFileSync(file, html);'
        fi
        export VITE_BUILD_SHA=$(printf '%s' "$full" | cut -c1-9)
      else
        export VITE_BUILD_SHA="${CI_COMMIT_SHORT_SHA:-local}"
      fi
    - npm ci --cache .npm --prefer-offline
    - export VITE_CLIENT_HOSTNAME=rgb.bittasker.com
    - export VITE_RGB_USDT_ASSET_ID=rgb:f~9F4X0C-TiLOTvy-pALF29V-2xJ2p0m-hP3_vpW-Alj4G5Y
    - export VITE_CLOUDFLARE_SITEKEY=0x4AAAAAABboTbbIVmXVwEvm
    - export VITE_NOSTR_RELAY_URL=wss://nos.lol
    - export VITE_NOSTR_TASK_RELAY_URL=wss://relay.primal.net
    - export VITE_NOSTR_LISTING_RELAY_URL=wss://relay.bittasker.com
    - export VITE_NOSTR_RELAY_NESTJS=https://api-staging.bittasker.com
    - export VITE_API_URL=https://api-staging.bittasker.com
    - export VITE_API_BASE_URL=https://api-staging.bittasker.com
    - export VITE_CREDIT_ENABLED=true
    - export VITE_TEMP_STAFF_ENABLED=true
    - export VITE_MARKET_ENABLED=true
    - export VITE_QVAC_ENABLED=true
    - export VITE_PARTIAL_USDT_POLICY=warn
    - export VITE_CHANGELLY_FIAT_ENABLED=true
    - |
      if [ -n "${PREVIEW_API_URL:-}" ]; then
        export VITE_API_URL="$PREVIEW_API_URL"
        export VITE_API_BASE_URL="$PREVIEW_API_URL"
      fi
      if [ -n "${PREVIEW_NOSTR_RELAY_NESTJS:-}" ]; then
        export VITE_NOSTR_RELAY_NESTJS="$PREVIEW_NOSTR_RELAY_NESTJS"
      fi
      if [ -n "${PREVIEW_NOSTR_RELAY_URL:-}" ]; then
        export VITE_NOSTR_RELAY_URL="$PREVIEW_NOSTR_RELAY_URL"
      fi
      if [ -n "${PREVIEW_NOSTR_TASK_RELAY_URL:-}" ]; then
        export VITE_NOSTR_TASK_RELAY_URL="$PREVIEW_NOSTR_TASK_RELAY_URL"
      fi
    - |
      case "$VITE_NOSTR_RELAY_URL" in
        *relay1-dev*|*relay2-dev*)
          echo "Preview build picked up a development relay. Upload stopped."
          exit 1
          ;;
      esac
      case "$VITE_NOSTR_LISTING_RELAY_URL" in
        wss://relay.bittasker.com) ;;
        *)
          echo "Preview listings must use wss://relay.bittasker.com. Upload stopped."
          exit 1
          ;;
      esac
      for name in VITE_API_URL VITE_API_BASE_URL VITE_NOSTR_RELAY_URL VITE_RGB_USDT_ASSET_ID VITE_CLOUDFLARE_SITEKEY; do
        case "$(printenv "$name" || true)" in
          *MEILI_SEARCH_KEY*|*SECRET*|*PRIVATE_KEY*|*API_TOKEN*)
            echo "$name looks like a secret. Preview stopped."
            exit 1
            ;;
        esac
      done
    - npm run build:dev
    - |
      set -euo pipefail
      # Turn on version preview hostnames without enabling workers.dev and
      # without deploying routes. `wrangler deploy` is what attaches
      # rgb.bittasker.com; this request only flips previews_enabled.
      node --input-type=module -e 'const account=process.env.CLOUDFLARE_ACCOUNT_ID; const token=process.env.CLOUDFLARE_API_TOKEN; const url="https://api.cloudflare.com/client/v4/accounts/"+account+"/workers/scripts/bittasker-sandbox/subdomain"; const response=await fetch(url,{method:"POST",headers:{Authorization:"Bearer "+token,"Content-Type":"application/json","Cloudflare-Workers-Script-Api-Date":"2025-08-01"},body:JSON.stringify({enabled:false,previews_enabled:true})}); const body=await response.json().catch(()=>({})); const result=body.result||{}; const errors=Array.isArray(body.errors)?body.errors.map((item)=>String(item.code||"")+(item.message?":"+item.message:"")).join("; "):""; console.log("subdomain status="+response.status+" success="+body.success+" enabled="+result.enabled+" previews_enabled="+result.previews_enabled+(errors?" errors="+errors:"")); if(!response.ok || result.enabled!==false || result.previews_enabled!==true) process.exit(1);'
      raw_alias=${PREVIEW_ALIAS:-${CI_COMMIT_REF_SLUG:-preview}}
      alias=$(printf '%s' "$raw_alias" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]/-/g; s/-\{2,\}/-/g; s/^-//; s/-$//')
      case "$alias" in
        [a-z]*) ;;
        *) alias="p${alias}" ;;
      esac
      max=44
      if [ "${#alias}" -gt "$max" ]; then
        alias=$(printf '%s' "$alias" | cut -c1-"$max" | sed 's/-$//')
      fi
      echo "Preview alias: $alias"
      echo "This job uploads a version only. It does not deploy rgb.bittasker.com."
      # Best effort. The Workers token is protected, so feature branches only
      # receive it after GitLab treats the branch as protected. Status only.
      node --input-type=module -e 'const base=process.env.CI_API_V4_URL; const project=process.env.CI_PROJECT_ID; const job=process.env.CI_JOB_TOKEN; if(!base||!project||!job){console.log("protect skipped"); process.exit(0);} for (const name of ["cursor/*","feature/*","fix/*"]) { const response=await fetch(base+"/projects/"+encodeURIComponent(project)+"/protected_branches",{method:"POST",headers:{"JOB-TOKEN":job,"Content-Type":"application/json"},body:JSON.stringify({name,push_access_level:30,merge_access_level:30,allow_force_push:false})}); console.log("protect "+name+" status="+response.status); }' || true
      set +e
      output=$(npx wrangler versions upload --env sandbox --preview-alias "$alias" --keep-vars --message "preview ${PREVIEW_SHA:-$CI_COMMIT_REF_NAME} ${PREVIEW_ALIAS:-$CI_COMMIT_SHORT_SHA}" 2>&1)
      status=$?
      set -e
      printf '%s\n' "$output"
      if [ "$status" -ne 0 ]; then
        exit "$status"
      fi
      if printf '%s\n' "$output" | grep -E -q 'Deployed .*rgb\.bittasker\.com|triggers deploy .*rgb\.bittasker\.com'; then
        echo "Preview upload tried to move the live route. Stopped."
        exit 1
      fi
      url=$(printf '%s\n' "$output" | sed -r 's/\x1B\[[0-9;]*[mK]//g' | sed -n 's/^Version Preview Alias URL: //p' | head -1 | tr -d '\r[:space:]')
      case "$url" in
        https://"$alias"-bittasker-sandbox.*.workers.dev) ;;
        *)
          echo "Preview alias URL was not printed. Upload did not publish a preview."
          exit 1
          ;;
      esac
      case "$url" in
        *rgb.bittasker.com*)
          echo "Preview URL points at the live host. Stopped."
          exit 1
          ;;
      esac
      printf 'PREVIEW_URL=%s\n' "$url" > preview.env
      echo "Preview URL: $url"
  artifacts:
    reports:
      dotenv: preview.env
    expire_in: 1 week
  environment:
    name: development
    action: prepare
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH == "dev"
      when: never
    - if: $CI_COMMIT_BRANCH == "master"
      when: never
    - if: $CI_COMMIT_BRANCH == "sandbox/rgb-wasm-phase0" && $PREVIEW_SHA
    - if: $CI_COMMIT_BRANCH == "sandbox/rgb-wasm-phase0"
      when: never
    - if: $CI_COMMIT_BRANCH =~ /^(feature|fix|cursor)\/.+/

# ═══════════════════════════════════════════════════════════════════════════════
# BACKUP — Database backups to Cloudflare R2 (scheduled pipelines only)
# ═══════════════════════════════════════════════════════════════════════════════
#
# Runs pg_dump for all three Railway PostgreSQL databases and uploads to
# Cloudflare R2 under RETENTION_TYPE prefix (daily/weekly/monthly).
#
# Three GitLab pipeline schedules trigger this job:
#   - Daily   → RETENTION_TYPE=daily,   cron: 0 3 * * *
#   - Weekly  → RETENTION_TYPE=weekly,  cron: 0 3 * * 0
#   - Monthly → RETENTION_TYPE=monthly, cron: 0 3 1 * *
#
# Required CI/CD variables (set in GitLab → Settings → CI/CD → Variables):
#   CLOUDFLARE_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_BUCKET
#   DATABASE_URL_API, DATABASE_URL_RELAY_TASKS, DATABASE_URL_RELAY_GENERAL
#   Each schedule must set RETENTION_TYPE = daily | weekly | monthly
#
# Job variables use expand: false so GitLab does not rewrite $ inside masked values.
#
# See docs/ci/server-backup.md for full setup instructions.
# ═══════════════════════════════════════════════════════════════════════════════
db-backup:
  image: postgres:18-alpine
  stage: backup
  timeout: 1 hour
  tags:
    - self-hosted
  # Re-bind secrets with expand: false — job-level variables default to expand: true,
  # which re-processes $ inside values pulled from CI/CD settings (see deploy-* jobs).
  variables:
    CLOUDFLARE_ACCOUNT_ID:
      value: $CLOUDFLARE_ACCOUNT_ID
      expand: false
    R2_ACCESS_KEY_ID:
      value: $R2_ACCESS_KEY_ID
      expand: false
    R2_SECRET_ACCESS_KEY:
      value: $R2_SECRET_ACCESS_KEY
      expand: false
    R2_BUCKET:
      value: $R2_BUCKET
      expand: false
    RETENTION_TYPE:
      value: $RETENTION_TYPE
      expand: false
    DATABASE_URL_API:
      value: $DATABASE_URL_API
      expand: false
    DATABASE_URL_RELAY_TASKS:
      value: $DATABASE_URL_RELAY_TASKS
      expand: false
    DATABASE_URL_RELAY_GENERAL:
      value: $DATABASE_URL_RELAY_GENERAL
      expand: false
  before_script:
    - apk add --no-cache python3 py3-pip
    - pip3 install --break-system-packages --quiet awscli
  script:
    - bash scripts/backup-databases.sh
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
  environment:
    name: production

db-backup-verify:
  image: postgres:18-alpine
  stage: backup
  timeout: 15 minutes
  tags:
    - self-hosted
  variables:
    CLOUDFLARE_ACCOUNT_ID:
      value: $CLOUDFLARE_ACCOUNT_ID
      expand: false
    R2_ACCESS_KEY_ID:
      value: $R2_ACCESS_KEY_ID
      expand: false
    R2_SECRET_ACCESS_KEY:
      value: $R2_SECRET_ACCESS_KEY
      expand: false
    R2_BUCKET:
      value: $R2_BUCKET
      expand: false
    RETENTION_TYPE:
      value: $RETENTION_TYPE
      expand: false
    DATABASE_URL_API:
      value: $DATABASE_URL_API
      expand: false
    DATABASE_URL_RELAY_TASKS:
      value: $DATABASE_URL_RELAY_TASKS
      expand: false
    DATABASE_URL_RELAY_GENERAL:
      value: $DATABASE_URL_RELAY_GENERAL
      expand: false
  before_script:
    - apk add --no-cache python3
  script:
    - bash scripts/test-backup-url-parse.sh
    - BACKUP_VERIFY_ONLY=1 bash scripts/backup-databases.sh
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
  environment:
    name: production

# ═══════════════════════════════════════════════════════════════════════════════
# ANDROID — Google Play Store release pipeline (fastlane)
# ═══════════════════════════════════════════════════════════════════════════════
#
# Internal testing: push v*-alpha* or v*-beta* tag on dev → auto-deploy.
# Production: push vX.Y.Z tag on master → android-release-prepare (auto) → manual Play / Zapstore.
# versionName from tag; versionCode auto-incremented once in android-release-prepare (shared by both stores).
# ═══════════════════════════════════════════════════════════════════════════════
include:
  - local: .gitlab/ci/android-release.yml
