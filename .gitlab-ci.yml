# GitLab CI/CD for BitTasker - Cloudflare Workers Deployment
# Still a work in progress
# triggering another commit to see if it works
# Branch strategy:
#   - dev → deploy to staging (staging.bittasker.com)
#   - main → deploy to production (worker.prod.bittasker.com)
#   - Other branches (e.g. feat/*) → validate only (test, lint, build)

stages:
  - validate
  - deploy

# ============================================
# VALIDATE - Runs on all branches
# ============================================
# Single test file: replace with a path that passes, or remove the path to run full suite
# Example: src/lib/tests/ci-placeholder.test.ts (placeholder) or src/lib/tests/dateFormatter.test.ts
validate:
  image: node:22-bookworm-slim
  stage: validate
  cache:
    key: $CI_COMMIT_REF_SLUG
    paths:
      - node_modules/
      - .npm/
  script:
    - npm ci --cache .npm --prefer-offline
    #- npm run check
    #- npm run lint
    # Run one test file; replace path when you have a passing test to run
    - npx vitest run src/lib/tests/ci-placeholder.test.ts
    - npm run build
  artifacts:
    paths:
      - build/
    expire_in: 1 hour

# ============================================
# DEPLOY STAGING - dev branch only
# ============================================
deploy-staging:
  image: node:22-bookworm-slim
  stage: deploy
  cache:
    key: $CI_COMMIT_REF_SLUG
    paths:
      - node_modules/
      - .npm/
  needs:
    - validate
  script:
    - npm ci --cache .npm --prefer-offline
    # Build with staging env vars (set in GitLab CI/CD variables)
    - npm run build
    - npx wrangler deploy --env staging
    - ENVIRONMENT=staging node scripts/purge-cache.js
  environment:
    name: staging
    url: https://staging.bittasker.com
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"

# ============================================
# DEPLOY PRODUCTION - main branch only
# ============================================
deploy-production:
  image: node:22-bookworm-slim
  stage: deploy
  cache:
    key: $CI_COMMIT_REF_SLUG
    paths:
      - node_modules/
      - .npm/
  needs:
    - validate
  script:
    - npm ci --cache .npm --prefer-offline
    # Build with production env vars (set in GitLab CI/CD variables)
    - npm run build:production
    - npx wrangler deploy --env production
    - ENVIRONMENT=production node scripts/purge-cache.js
  environment:
    name: production
    url: https://worker.prod.bittasker.com
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
