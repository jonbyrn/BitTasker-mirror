# GitLab CI/CD for BitTasker - Cloudflare Workers Deployment
#
# -----------------------------------------------------------------------------------------------
# STAGES
# -----------------------------------------------------------------------------------------------
#   validate  → build + unit (branch pushes only) + coverage (MR only). No duplicate test runs.
#   deploy    → deploy-development (dev branch), deploy-staging / deploy-production (commented)
#
# Build runs once; deploy reuses build/ (wrangler deploy, no rebuild).
# Unit tests (Vitest) run against source; no built app needed.
#
# -----------------------------------------------------------------------------------------------
# RUNNERS
# -----------------------------------------------------------------------------------------------
#   All jobs use tags: [self-hosted] so the pipeline runs on your self-hosted GitLab runner.
#
# -----------------------------------------------------------------------------------------------
# BRANCH STRATEGY (no feature-branch names — use long-lived branches only)
# -----------------------------------------------------------------------------------------------
#   When to run the pipeline:
#     - Merge requests  → build + coverage (tests with coverage for MR widget). No unit job (coverage does it).
#     - Push to dev     → build + unit. deploy-development runs (deploys to worker.dev.bittasker.com).
#     - Push to master  → build + unit. deploy-production commented out; uncomment when ready.
#
#   What to include in rules:
#     Use merge_request_event for MRs, and explicit branch names for the branches you actually use:
#     dev, master (or main). Do NOT hardcode feature branches (e.g. feat/unit-test-audit); when you
#     work on a feature, open an MR to dev → pipeline runs via merge_request_event. When you merge
#     to dev, the dev pipeline runs and deploys. To test deploy from a feature branch temporarily,
#     add one rule to deploy-development: - if: $CI_COMMIT_BRANCH == "your-feature-branch".
#
#   See docs/ci/pipeline-branch-strategy.md for the full approach.
#
# -----------------------------------------------------------------------------------------------
# E2E (PLAYWRIGHT)
# -----------------------------------------------------------------------------------------------
#   The legacy full-app Playwright job remains commented out, but the service/homepage browser slices
#   are active through `service-quote-e2e`. That job runs against the built preview app and first
#   executes `npm run test:e2e:validate-service-bootstrap` to fail closed if the harness/mocked
#   service suite contract drifts.
#
# -----------------------------------------------------------------------------------------------
# CACHE
# -----------------------------------------------------------------------------------------------
#   Key from package-lock.json so the same lockfile reuses cache across branches and MRs.
#   Build job uses policy: pull-push (creates/updates cache). Other jobs use policy: pull only
#   (restore but don't upload), saving ~1–2 min per job and avoiding duplicate uploads.
#   "No URL provided" in logs = cache is local to the runner; for multiple runners configure
#   a distributed cache (e.g. S3) in the runner's config.toml.
# -----------------------------------------------------------------------------------------------
# WRANGLER / VARIABLES
# -----------------------------------------------------------------------------------------------
#   GitLab injects CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID. Build-time VITE_* in GitLab.
# -----------------------------------------------------------------------------------------------
stages:
  - validate
  - deploy

# ============================================
# BUILD - Single build for E2E and deploy (validate stage)
# ============================================
# Runs once. Artifact build/ is used by playwright (preview only) and deploy-development (wrangler deploy).
# environment: development → GitLab injects variables scoped to "development" (VITE_*, etc.).
# For staging/production later: add build-staging (environment: staging) and build-production (environment: production),
# or use environment-scoped variables and one build job per branch (e.g. rules + environment per job).
build:
  image: node:22-bookworm-slim
  stage: validate
  tags:
    - self-hosted
  environment:
    name: development
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
      - .npm/
    policy: pull-push
  before_script:
    # bookworm-slim omits CA certificates; install them so sentry-cli can reach sentry.io over HTTPS.
    # Skip apt-get update if ca-certificates is already present (e.g. warm runner cache).
    - dpkg -s ca-certificates > /dev/null 2>&1 || (apt-get update -qq && apt-get install -y -qq ca-certificates && update-ca-certificates)
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run build
  artifacts:
    paths:
      - build/
      - .svelte-kit/output/
    expire_in: 1 hour
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "dev"
    - if: $CI_COMMIT_BRANCH == "master"

# ============================================
# UNIT - Unit tests (no coverage)
# ============================================
# Runs test:ci on branch pushes. Does NOT run on MRs (coverage runs there) or on dev/master
# (coverage runs there too so GitLab has a stored baseline for "change vs. target" in the MR widget).
# One test run per pipeline.
unit:
  image: node:22-bookworm-slim
  stage: validate
  tags:
    - self-hosted
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
      - .npm/
    policy: pull
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run test:ci
  environment:
    name: development
  rules:
    # Skip on MR (coverage runs) and on dev/master (coverage runs for baseline)
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $CI_COMMIT_BRANCH == "dev"
      when: never
    - if: $CI_COMMIT_BRANCH == "master"
      when: never
    # Run on other branch pushes (if any)
    - when: on_success

# ============================================
# COVERAGE - MR and target branches (for widget % and "change vs. target")
# ============================================
# Runs unit tests with coverage and reports to GitLab so the MR shows:
#   - Coverage percentage and change vs. target branch (from coverage: regex)
#   - Line-by-line coverage in MR diff (from artifacts: reports: coverage_report)
# Runs on merge_request_event (MRs) and on push to dev/master so GitLab has a stored
# coverage for the target branch; without that, the widget cannot show "change vs. target".
coverage:
  image: node:22-bookworm-slim
  stage: validate
  tags:
    - self-hosted
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
      - .npm/
    policy: pull
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run test:ci -- --coverage
  environment:
    name: development
  coverage: '/All files[^|]*\|[^|]*\|[^|]*\|[^|]*\|\s*(\d+\.?\d*)%?/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml
    paths:
      - coverage/
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "dev"
    - if: $CI_COMMIT_BRANCH == "master"

