# GitLab CI/CD for BitTasker - Cloudflare Workers Deployment
#
# Branch strategy:
#   - feat/workers-deployment (or any branch matching rules below) → validate + deploy to development (worker.dev.bittasker.com)
#   - dev → validate + deploy to staging (staging.bittasker.com)
#   - main → validate + deploy to production (worker.prod.bittasker.com)
#   - Other branches → validate only (test, lint, build)
#
# How wrangler deploys from CI: GitLab injects CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID
# from CI/CD Variables into the job env; wrangler uses them (no interactive login). Build-time
# VITE_* must be set in GitLab so "npm run build" bakes them into the client bundle.
#
# -----------------------------------------------------------------------------------------------
# QUICK FEEDBACK MODE (E2E signup/onboarding testing)
# -----------------------------------------------------------------------------------------------
# Currently ONLY the Playwright E2E job runs. The following are COMMENTED OUT for a faster
# feedback loop:
#   - validate (Vitest unit tests: test:ci; optional check/lint/build)
#   - deploy-development (feat/workers-deployment → worker.dev.bittasker.com)
#   - deploy-staging (dev → staging.bittasker.com)
#   - deploy-production (main → worker.prod.bittasker.com)
#
# TO RESTORE NORMAL PIPELINE (after E2E testing is done):
#   1. Uncomment the "validate" job: remove the leading "# " from every line of the block that
#      starts with "# validate:" and ends before "# ============ PLAYWRIGHT".
#   2. Uncomment the "deploy-development" job: same for the block starting with "# deploy-development:".
#   3. Uncomment the "deploy-staging" job: same for the block starting with "# deploy-staging:".
#   4. Uncomment the "deploy-production" job: same for the block starting with "# deploy-production:".
#   5. Leave the "playwright" job as-is (no needs: validate; it runs in validate stage).
#   6. In validate, uncomment "npm run check", "npm run lint", "npm run build" if you use them in CI.
#
# Quick find: search for "# validate:", "# deploy-development:", "# deploy-staging:", "# deploy-production:"
# to locate each commented block.
#
# For this mode, set VITE_API_URL in GitLab CI/CD Variables to your dev API base URL so the
# signup-onboarding spec can complete the username step (availability check).
# -----------------------------------------------------------------------------------------------
stages:
  - validate
  - deploy

# ============================================
# VALIDATE - Runs on all branches (COMMENTED for quick E2E feedback)
# ============================================
# Uncomment this entire block to restore unit tests in CI.
# validate:
#   image: node:22-bookworm-slim
#   stage: validate
#   cache:
#     key: $CI_COMMIT_REF_SLUG
#     paths:
#       - node_modules/
#       - .npm/
#   script:
#     - npm ci --cache .npm --prefer-offline
#     #- npm run check
#     #- npm run lint
#     - npm run test:ci
#     #- npm run build
#   artifacts:
#     paths:
#       - build/
#     expire_in: 1 hour

# ============================================
# PLAYWRIGHT E2E - Signup & onboarding (validate stage)
# ============================================
# Uses Playwright Docker image. Starts app via webServer in playwright.config.
# Requires VITE_API_URL in CI/CD Variables. Run locally: VITE_API_URL=... npx playwright test --project=chromium tests/e2e/signup-onboarding.spec.ts
playwright:
  image: mcr.microsoft.com/playwright:v1.54.0-noble
  stage: validate
  cache:
    key: $CI_COMMIT_REF_SLUG
    paths:
      - node_modules/
      - .npm/
  script:
    - npm ci --cache .npm --prefer-offline
    - npx playwright test --project=chromium tests/e2e/signup-onboarding.spec.ts
  environment:
    name: development
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "feat/workers-deployment"
    - if: $CI_COMMIT_BRANCH == "dev"
    - if: $CI_COMMIT_BRANCH == "main"

# ============================================
# DEPLOY DEVELOPMENT - test full pipeline path (worker.dev.bittasker.com)
# ============================================
# Runs on feat/workers-deployment so you can test validate + deploy without touching staging/production.
# Uses GitLab "development" environment. Requires CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID,
# and dev VITE_* in GitLab CI/CD Variables (scoped to "development" or All).
# Important: If variables are marked "Protected", they are only injected on protected branches.
# For feat/workers-deployment (unprotected), either uncheck Protected for these vars or protect the branch.
