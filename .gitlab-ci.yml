# GitLab CI/CD for BitTasker - Cloudflare Workers Deployment
#
# -----------------------------------------------------------------------------------------------
# STAGES
# -----------------------------------------------------------------------------------------------
#   validate  → build (branch pushes only) + coverage (MR only). No duplicate test runs.
#   deploy    → deploy-development (dev branch), deploy-production (master branch)
#   backup    → db-backup (scheduled pipelines only)
#
# Build runs once per deploy pipeline; deploy reuses build/ artifact (wrangler deploy, no rebuild).
# Unit tests (Vitest) run against source; no built app needed.
#
# -----------------------------------------------------------------------------------------------
# PIPELINE STRATEGY
# -----------------------------------------------------------------------------------------------
#   Merge requests  → coverage only (quality gate). No build (coverage runs vitest against source).
#   Push to dev     → build + deploy-development.
#   Push to master  → build-production + deploy-production.
#   Scheduled       → db-backup.
#
#   Pipelines auto-cancel on new commits to the same ref (interruptible: true).
#
# -----------------------------------------------------------------------------------------------
# RUNNERS
# -----------------------------------------------------------------------------------------------
#   All jobs use tags: [self-hosted] so the pipeline runs on your self-hosted GitLab runner.
#
# -----------------------------------------------------------------------------------------------
# CACHE
# -----------------------------------------------------------------------------------------------
#   Key from package-lock.json so the same lockfile reuses cache across branches and MRs.
#   Build jobs use policy: pull-push (creates/updates cache). Other jobs use policy: pull only.
# -----------------------------------------------------------------------------------------------
# WRANGLER / VARIABLES
# -----------------------------------------------------------------------------------------------
#   GitLab injects CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID. Build-time VITE_* in GitLab.
# -----------------------------------------------------------------------------------------------
workflow:
  auto_cancel:
    on_new_commit: interruptible

stages:
  - validate
  - build-android
  - deploy
  - deploy-android
  - backup

# ============================================
# BUILD - Development build (dev branch only)
# ============================================
build:
  image: node:22-bookworm-slim
  stage: validate
  interruptible: true
  tags:
    - self-hosted
  environment:
    name: development
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
      - .npm/
    policy: pull-push
  before_script:
    - dpkg -s ca-certificates > /dev/null 2>&1 || (apt-get update -qq && apt-get install -y -qq ca-certificates && update-ca-certificates)
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run build
  artifacts:
    paths:
      - build/
      - .svelte-kit/output/
    expire_in: 1 hour
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"

# ============================================
# BUILD-PRODUCTION - Production build (master branch only)
# ============================================
build-production:
  image: node:22-bookworm-slim
  stage: validate
  interruptible: true
  tags:
    - self-hosted
  environment:
    name: production
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
      - .npm/
    policy: pull-push
  before_script:
    - dpkg -s ca-certificates > /dev/null 2>&1 || (apt-get update -qq && apt-get install -y -qq ca-certificates && update-ca-certificates)
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run build:production
  artifacts:
    paths:
      - build/
      - .svelte-kit/output/
    expire_in: 1 hour
  rules:
    - if: $CI_COMMIT_BRANCH == "master"

# ============================================
# COVERAGE - MR only (quality gate)
# ============================================
# Runs unit tests with coverage and reports to GitLab so the MR shows coverage percentage.
# Runs on merge_request_event only — no duplicate test runs on branch pushes.
coverage:
  image: node:22-bookworm-slim
  stage: validate
  interruptible: true
  tags:
    - self-hosted
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
      - .npm/
    policy: pull
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run test:ci -- --coverage
  environment:
    name: development
  coverage: '/All files[^|]*\|[^|]*\|[^|]*\|[^|]*\|\s*(\d+\.?\d*)%?/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml
    paths:
      - coverage/
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
