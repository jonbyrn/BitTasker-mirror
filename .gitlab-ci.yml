# ═══════════════════════════════════════════════════════════════════════════════
# BACKUP — Database backups to Cloudflare R2 (scheduled pipelines only)
# ═══════════════════════════════════════════════════════════════════════════════
#
# Runs pg_dump for all three Railway PostgreSQL databases and uploads to
# Cloudflare R2 under RETENTION_TYPE prefix (daily/weekly/monthly).
#
# Three GitLab pipeline schedules trigger this job:
#   - Daily   → RETENTION_TYPE=daily,   cron: 0 3 * * *
#   - Weekly  → RETENTION_TYPE=weekly,  cron: 0 3 * * 0
#   - Monthly → RETENTION_TYPE=monthly, cron: 0 3 1 * *
#
# Required CI/CD variables (set in GitLab → Settings → CI/CD → Variables):
#   CLOUDFLARE_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_BUCKET
#   DATABASE_URL_API, DATABASE_URL_RELAY_TASKS, DATABASE_URL_RELAY_GENERAL
#   Each schedule must set RETENTION_TYPE = daily | weekly | monthly
#
# Job variables use expand: false so GitLab does not rewrite $ inside masked values.
#
# See docs/ci/server-backup.md for full setup instructions.
# ═══════════════════════════════════════════════════════════════════════════════
db-backup:
  image: postgres:18-alpine
  stage: backup
  timeout: 1 hour
  tags:
    - self-hosted
  # Re-bind secrets with expand: false — job-level variables default to expand: true,
  # which re-processes $ inside values pulled from CI/CD settings (see deploy-* jobs).
  variables:
    CLOUDFLARE_ACCOUNT_ID:
      value: $CLOUDFLARE_ACCOUNT_ID
      expand: false
    R2_ACCESS_KEY_ID:
      value: $R2_ACCESS_KEY_ID
      expand: false
    R2_SECRET_ACCESS_KEY:
      value: $R2_SECRET_ACCESS_KEY
      expand: false
    R2_BUCKET:
      value: $R2_BUCKET
      expand: false
    RETENTION_TYPE:
      value: $RETENTION_TYPE
      expand: false
    DATABASE_URL_API:
      value: $DATABASE_URL_API
      expand: false
    DATABASE_URL_RELAY_TASKS:
      value: $DATABASE_URL_RELAY_TASKS
      expand: false
    DATABASE_URL_RELAY_GENERAL:
      value: $DATABASE_URL_RELAY_GENERAL
      expand: false
  before_script:
    - apk add --no-cache python3 py3-pip
    - pip3 install --break-system-packages --quiet awscli
  script:
    - bash scripts/backup-databases.sh
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
  environment:
    name: production

db-backup-verify:
  image: postgres:18-alpine
  stage: backup
  timeout: 15 minutes
  tags:
    - self-hosted
  variables:
    CLOUDFLARE_ACCOUNT_ID:
      value: $CLOUDFLARE_ACCOUNT_ID
      expand: false
    R2_ACCESS_KEY_ID:
      value: $R2_ACCESS_KEY_ID
      expand: false
    R2_SECRET_ACCESS_KEY:
      value: $R2_SECRET_ACCESS_KEY
      expand: false
    R2_BUCKET:
      value: $R2_BUCKET
      expand: false
    RETENTION_TYPE:
      value: $RETENTION_TYPE
      expand: false
    DATABASE_URL_API:
      value: $DATABASE_URL_API
      expand: false
    DATABASE_URL_RELAY_TASKS:
      value: $DATABASE_URL_RELAY_TASKS
      expand: false
    DATABASE_URL_RELAY_GENERAL:
      value: $DATABASE_URL_RELAY_GENERAL
      expand: false
  before_script:
    - apk add --no-cache python3
  script:
    - bash scripts/test-backup-url-parse.sh
    - BACKUP_VERIFY_ONLY=1 bash scripts/backup-databases.sh
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
  environment:
    name: production

# ═══════════════════════════════════════════════════════════════════════════════
# ANDROID — Google Play Store release pipeline (fastlane)
# ═══════════════════════════════════════════════════════════════════════════════
#
# Internal testing: push v*-alpha* or v*-beta* tag on dev → auto-deploy.
# Production: push vX.Y.Z tag on master → android-release-prepare (auto) → manual Play / Zapstore.
# versionName from tag; versionCode auto-incremented once in android-release-prepare (shared by both stores).
# ═══════════════════════════════════════════════════════════════════════════════
include:
  - local: .gitlab/ci/android-release.yml
