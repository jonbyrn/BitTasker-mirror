# ============================================
# DEPLOY DEVELOPMENT (worker.dev.bittasker.com)
# ============================================
deploy-development:
  image: node:24-bookworm-slim
  stage: deploy
  interruptible: true
  tags:
    - self-hosted
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
      - .npm/
    policy: pull
  needs:
    - build-development
  variables:
    SENTRY_URL: https://gt.bittasker.com
  before_script:
    - dpkg -s ca-certificates > /dev/null 2>&1 || (apt-get update -qq && apt-get install -y -qq ca-certificates && update-ca-certificates)
  script:
    - npm ci --cache .npm --prefer-offline
    # Same asset default as build-development. Wrangler may rebuild from
    # [env.dev.build]; relays stay on the development environment scope.
    - |
      export VITE_RGB_USDT_ASSET_ID="${VITE_RGB_USDT_ASSET_ID:-rgb:2s69152-rg39309-8438210-usdt_testnet}"
      npx wrangler deploy --env dev
      ENVIRONMENT=dev node scripts/purge-cache.js
  environment:
    name: development
    url: https://dev.bittasker.com
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH == "dev"

# ============================================
# DEPLOY SANDBOX (rgb.bittasker.com)
# Branch sandbox/rgb-wasm-phase0 only.
# The Workers token is scoped to the development environment, so this job
# uses that name with action: prepare (no deployment record, URL unchanged).
# Job variables and the script exports pin the sandbox relays. They win over
# relay1-dev from the development scope.
# GitLab 18.6 does not expand a job variable that references itself, so
# CLOUDFLARE_API_TOKEN: $CLOUDFLARE_API_TOKEN stays the literal string and
# Wrangler never authenticates. Copy the project variable into a different
# name; the script then puts that value back into the names Wrangler reads.
# ============================================
deploy-sandbox:
  image: node:24-bookworm-slim
  stage: deploy
  interruptible: true
  tags:
    - self-hosted
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
      - .npm/
    policy: pull
  variables:
    # Different names so GitLab expands the project variables. A same-name
    # binding stays the literal "$CLOUDFLARE_API_TOKEN".
    CF_API_TOKEN: $CLOUDFLARE_API_TOKEN
    CF_ACCOUNT_ID: $CLOUDFLARE_ACCOUNT_ID
    VITE_CLIENT_HOSTNAME: rgb.bittasker.com
    VITE_NOSTR_RELAY_URL: wss://nos.lol
    VITE_NOSTR_TASK_RELAY_URL: wss://relay.primal.net
    VITE_NOSTR_RELAY_NESTJS: https://api-staging.bittasker.com
    VITE_API_URL: https://api-staging.bittasker.com
    VITE_API_BASE_URL: https://api-staging.bittasker.com
    VITE_RGB_USDT_ASSET_ID: rgb:f~9F4X0C-TiLOTvy-pALF29V-2xJ2p0m-hP3_vpW-Alj4G5Y
    VITE_CLOUDFLARE_SITEKEY: 0x4AAAAAABboTbbIVmXVwEvm
    VITE_CREDIT_ENABLED: "true"
  before_script:
    - dpkg -s ca-certificates > /dev/null 2>&1 || (apt-get update -qq && apt-get install -y -qq ca-certificates && update-ca-certificates)
    - |
      # Read a project variable by scope when this job's environment did not inject it.
      # Status codes go to the log. The value stays on stdout and is never printed.
      fetch_scoped_var() {
        FETCH_KEY="$1" node --input-type=module -e 'const key=process.env.FETCH_KEY; const base=process.env.CI_API_V4_URL; const project=process.env.CI_PROJECT_ID; const job=process.env.CI_JOB_TOKEN; const api=process.env.CI_API_TOKEN; if(!key||!base||!project) process.exit(1); const headers=[]; if(job) headers.push(["JOB-TOKEN",job]); if(api) headers.push(["PRIVATE-TOKEN",api]); const notes=[]; for (const [name,header] of headers) { for (const scope of ["development","production","*"]) { const url=base+"/projects/"+encodeURIComponent(project)+"/variables/"+encodeURIComponent(key)+"?filter%5Benvironment_scope%5D="+encodeURIComponent(scope); try { const response=await fetch(url,{headers:{[name]:header}}); notes.push(name+"/"+scope+":"+response.status); if(!response.ok) continue; const body=await response.json(); if(typeof body.value==="string" && body.value.length>0 && !body.value.startsWith("$")) { console.error("variable lookup "+key+" "+notes.join(",")); process.stdout.write(body.value); process.exit(0); } } catch (error) { notes.push(name+"/"+scope+":error"); } } } console.error("variable lookup "+key+" "+(notes.join(",")||"no-token")); process.exit(1);'
      }
      if [ -n "${CI_API_TOKEN-}" ]; then api_state=set; else api_state=unset; fi
      echo "env=${CI_ENVIRONMENT_NAME:-unset} protected=${CI_COMMIT_REF_PROTECTED:-unset} ci_api_token=${api_state}"
      classify() {
        raw=$(printenv "$1" || true)
        if [ -z "$raw" ]; then
          echo "$1=unset"
        else
          case "$raw" in
            \$*) echo "$1=literal" ;;
            *) echo "$1=set length=${#raw}" ;;
          esac
        fi
      }
      classify CLOUDFLARE_API_TOKEN
      classify CLOUDFLARE_ACCOUNT_ID
      classify CF_API_TOKEN
      classify CF_ACCOUNT_ID
      bad() {
        case "$1" in
          ''|\$*) return 0 ;;
          *) return 1 ;;
        esac
      }
      if bad "${CLOUDFLARE_API_TOKEN-}" && ! bad "${CF_API_TOKEN-}"; then
        export CLOUDFLARE_API_TOKEN="$CF_API_TOKEN"
      fi
      if bad "${CLOUDFLARE_ACCOUNT_ID-}" && ! bad "${CF_ACCOUNT_ID-}"; then
        export CLOUDFLARE_ACCOUNT_ID="$CF_ACCOUNT_ID"
      fi
      if bad "${CLOUDFLARE_API_TOKEN-}"; then
        fetched=$(FETCH_KEY=CLOUDFLARE_API_TOKEN fetch_scoped_var CLOUDFLARE_API_TOKEN || true)
        if [ -n "$fetched" ]; then export CLOUDFLARE_API_TOKEN="$fetched"; fi
      fi
      if bad "${CLOUDFLARE_ACCOUNT_ID-}"; then
        fetched=$(FETCH_KEY=CLOUDFLARE_ACCOUNT_ID fetch_scoped_var CLOUDFLARE_ACCOUNT_ID || true)
        if [ -n "$fetched" ]; then export CLOUDFLARE_ACCOUNT_ID="$fetched"; fi
      fi
      unset fetched raw
      token=$(printf '%s' "${CLOUDFLARE_API_TOKEN-}" | tr -d '\r\n')
      token=${token#"Bearer "}
      token=${token#"bearer "}
      token=$(printf '%s' "$token" | tr -d ' \t')
      account=$(printf '%s' "${CLOUDFLARE_ACCOUNT_ID-}" | tr -d ' \t\r\n')
      case "$token" in
        ''|\$*)
          echo "Cloudflare token is missing. protected=${CI_COMMIT_REF_PROTECTED:-unset} env=${CI_ENVIRONMENT_NAME:-unset}."
          echo "The Workers token is a protected CI variable. GitLab only injects it on a protected branch."
          echo "sandbox/rgb-wasm-phase0 is unprotected, so the deploy cannot authenticate. The account id is already present."
          echo "Protect this branch with developer push, the same way dev is protected, then rerun."
          exit 1
          ;;
      esac
      case "$account" in
        ''|\$*)
          echo "Cloudflare account id is missing or still an unexpanded CI variable. Deploy stopped."
          exit 1
          ;;
      esac
      export CLOUDFLARE_API_TOKEN="$token"
      export CLOUDFLARE_ACCOUNT_ID="$account"
      unset CF_API_TOKEN CF_ACCOUNT_ID
      echo "Cloudflare token length ${#CLOUDFLARE_API_TOKEN}, account length ${#CLOUDFLARE_ACCOUNT_ID}"
  script:
    - npm ci --cache .npm --prefer-offline
    - export VITE_BUILD_SHA="${CI_COMMIT_SHORT_SHA:-local}"
    - export VITE_CLIENT_HOSTNAME=rgb.bittasker.com
    - export VITE_RGB_USDT_ASSET_ID=rgb:f~9F4X0C-TiLOTvy-pALF29V-2xJ2p0m-hP3_vpW-Alj4G5Y
    - export VITE_CLOUDFLARE_SITEKEY=0x4AAAAAABboTbbIVmXVwEvm
    - export VITE_NOSTR_RELAY_URL=wss://nos.lol
    - export VITE_NOSTR_TASK_RELAY_URL=wss://relay.primal.net
    - export VITE_NOSTR_RELAY_NESTJS=https://api-staging.bittasker.com
    - export VITE_API_URL=https://api-staging.bittasker.com
    - export VITE_API_BASE_URL=https://api-staging.bittasker.com
    - export VITE_CREDIT_ENABLED=true
    - |
      case "$VITE_NOSTR_RELAY_URL" in
        *relay1-dev*|*relay2-dev*)
          echo "Sandbox build picked up a development relay. Deploy stopped."
          exit 1
          ;;
      esac
    - npm run build:dev
    - npx wrangler deploy --env sandbox
    - ENVIRONMENT=sandbox node scripts/purge-cache.js
  environment:
    name: development
    action: prepare
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH == "sandbox/rgb-wasm-phase0"

# ============================================
# DEPLOY PRODUCTION (worker.prod.bittasker.com)
# ============================================
deploy-production:
  image: node:24-bookworm-slim
  stage: deploy
  interruptible: true
  tags:
    - self-hosted
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
      - .npm/
    policy: pull
  needs:
    - build-production
  before_script:
    - dpkg -s ca-certificates > /dev/null 2>&1 || (apt-get update -qq && apt-get install -y -qq ca-certificates && update-ca-certificates)
  script:
    - npm ci --cache .npm --prefer-offline
    - npx wrangler deploy --env production
    - ENVIRONMENT=production node scripts/purge-cache.js
  environment:
    name: production
    url: https://worker.prod.bittasker.com
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH == "master"

