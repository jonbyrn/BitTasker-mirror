"""
Indicates exactly one field must be supplied and this field must not be `null`.
"""
directive @oneOf on INPUT_OBJECT

input AttachmentInput {
  fileName: String!
  fileSize: Float
  fileUrl: String!
}

type AttachmentOutput {
  fileName: String!
  fileSize: Float
  fileUrl: String!
}

type Auth {
  access_token: String!
  expires_in: Int!
  token_type: String!
  user: User!
}

type Bid {
  amount: Float!
  clicks: Int!
  clientResponse: String
  clientViewed: Boolean!
  clientViewedAt: DateTime
  competitiveScore: Float
  coverLetter: String
  createdAt: DateTime!
  currency: String
  description: String
  estimatedDuration: String
  estimatedHours: Int
  expiresAt: DateTime
  featured: Boolean!
  freelancer: PublicFreelancer
  hourlyRate: Float
  id: ID!
  impressions: Int!
  isWithdrawn: Boolean!
  milestones: [BidMilestoneOutput!]
  paymentType: BidPaymentType!
  proposedApproach: String
  rank: Int
  responseTime: Int
  status: BidStatus!
  updatedAt: DateTime!
  visibility: BidVisibility!
  withdrawnReason: String
}

type BidMilestoneOutput {
  amount: Float!
  deliverables: String
  description: String!
  dueDate: DateTime
  estimatedHours: Int
  sequence: Int
  title: String!
}

type BidPaginationDto {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  limit: Int!
  page: Int!
  total: Int!
  totalPages: Int!
}

enum BidPaymentType {
  FIXED
  HOURLY
  MILESTONE_BASED
}

type BidResponse {
  bid: Bid!
  message: String!
}

enum BidStatus {
  ACCEPTED
  APPROVED
  CLIENT_CANCELLED
  EXPIRED
  FREELANCER_CANCELLED
  NEGOTIATION
  PENDING
  REJECTED
  WITHDRAWN
}

enum BidVisibility {
  FEATURED
  PRIVATE
  PUBLIC
}

type BidsWithPaginationDto {
  data: [Bid!]!
  pagination: BidPaginationDto!
}

enum BudgetType {
  FIXED
  HOURLY
  RANGE
}

type Category {
  createdAt: DateTime!
  description: String
  displayOrder: Float!
  icon: String
  id: ID!
  isActive: Boolean!
  name: String!
  parentId: Float
  slug: String!
  updatedAt: DateTime!
}

input ChangePasswordInput {
  currentPassword: String!
  newPassword: String!
}

type Client {
  averageRating: Float
  createdAt: DateTime!
  id: ID!
  updatedAt: DateTime!
  user: PublicUser!
  userId: Int!
}

input CreateBidInput {
  amount: Float!
  coverLetter: String
  currency: String = "USD"
  description: String
  estimatedDuration: String
  estimatedHours: Int
  hourlyRate: Float
  milestones: [CreateBidMilestoneInput!]
  paymentType: BidPaymentType! = FIXED
  proposedApproach: String
  responseTime: Int
  taskId: Int!
  visibility: BidVisibility = PUBLIC
}

input CreateBidMilestoneInput {
  amount: Float!
  deliverables: String
  description: String!
  dueDate: DateTime
  estimatedHours: Int
  sequence: Int
  title: String!
}

input CreateTaskFromTemplateDto {
  taskOverrides: UpdateTaskInput
}

input CreateTaskInput {
  addressLine1: String
  addressLine2: String
  attachments: [AttachmentInput!]
  boostAmount: Float
  boostDuration: Int
  boostTask: Boolean
  budget: Float
  budgetType: BudgetType = FIXED
  categoryIds: [Int!]
  city: String
  country: String
  dateRange: DateRangeInput
  deadlineDate: String
  description: String!
  dropOffLocation: LocationInput
  estimatedHours: Float
  imageUrls: [String!]
  isRemovals: Boolean
  latitude: Float
  longitude: Float
  pickupLocation: LocationInput
  postalCode: String
  saveAsTemplate: Boolean
  skillIds: [Int!]
  skillImportance: SkillImportance
  state: String
  taskType: TaskType
  templateId: Int
  templateName: String
  title: String!
  visibility: TaskVisibility
}

input CreateTaskTemplateInput {
  description: String
  existingTaskId: Int
  isRecurring: Boolean = false
  name: String!
  recurrencePattern: RecurrencePatternInput
  recurrenceType: RecurrenceType
  task: CreateTaskInput
}

input DateRangeInput {
  end: String
  start: String
}

type DateRangeOutput {
  end: String
  start: String
}

"""
A date-time string at UTC, such as 2019-12-03T09:54:33Z, compliant with the date-time format.
"""
scalar DateTime

input LocationInput {
  displayName: String
  latitude: Float

  """Whether location data is loaded"""
  locationLoaded: Boolean! = true
  longitude: Float
  zipCode: String
}

type LocationOutput {
  displayName: String
  latitude: Float

  """Whether location data is loaded"""
  locationLoaded: Boolean!
  longitude: Float
  zipCode: String
}

input LoginInput {
  email: String!
  password: String!
}

type Mutation {
  acceptBid(id: Int!): BidResponse!
  changePassword(input: ChangePasswordInput!): Boolean!
  changeTaskStatus(status: TaskStatus!, taskId: ID!): Task!
  createBid(input: CreateBidInput!): BidResponse!
  createTask(input: CreateTaskInput!): Task!
  createTaskFromTemplate(input: CreateTaskFromTemplateDto, templateId: Int!): Task!
  createTaskTemplate(input: CreateTaskTemplateInput!): TaskTemplateResponse!
  deleteTask(id: Int!): Boolean!
  deleteTaskTemplate(id: Int!): Boolean!
  login(input: LoginInput!): Auth!
  register(input: RegisterInput!): Auth!
  rejectBid(id: Int!): BidResponse!
  updateBid(id: Int!, input: UpdateBidInput!): BidResponse!
  updateTask(id: Int!, input: UpdateTaskInput!): Task!
  updateTaskTemplate(id: Int!, input: UpdateTaskTemplateInput!): TaskTemplateResponse!
  updateUser(id: Int!, input: UpdateUserInput!): User!
  updateUserProfile(input: UpdateUserProfileInput!): User!
  verifyTurnstileToken(input: TurnstileVerificationInput!): TurnstileVerificationResult!
  withdrawBid(id: Int!, reason: String): Boolean!
}

type OnboardingStatusDto {
  isComplete: Boolean!
  missingFields: [String!]!
}

type PaginatedTasksResponse {
  items: [Task!]!
  meta: PaginationMeta!
}

type PaginationMeta {
  currentPage: Int!
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  itemCount: Int!
  itemsPerPage: Int!
  totalItems: Int!
  totalPages: Int!
}

type PublicFreelancer {
  averageRating: Float
  bio: String
  id: ID!
  level: Int!
  professionalTitle: String
  specialties: [String!]
  user: PublicUser!
  yearsExperience: Float
}

type PublicUser {
  displayName: String
  id: ID!
  name: String
  profilePictureId: String
  profilePictureUrl: String
  userRole: UserRole!
  username: String
}

type Query {
  IsOnboardingComplete: OnboardingStatusDto!
  bid(id: Int!): Bid!
  bids: UserBidsResponse!
  bidsByTask(taskId: Int!): [Bid!]!
  categories: [Category!]!
  category(id: Int!): Category
  checkUsernameAvailability(username: String!): Boolean!
  getUsernameHistory(userId: Int!): [String!]!
  me: User!
  myTasks: [Task!]!
  searchSkills(query: String!): [String!]!
  skill(id: Int!): Skill
  skills: [Skill!]!
  task(id: Int!): Task!
  taskTemplateById(id: Int!): TaskTemplateResponse!
  taskTemplates: [TaskTemplateResponse!]!
  tasks(input: SearchTasksDto!): PaginatedTasksResponse!
  user(id: Int!): User!
  users: [User!]!
  verifyToken(token: String!): TokenVerificationResult!
}

enum RecurrenceFrequency {
  BIWEEKLY
  CUSTOM
  DAILY
  MONTHLY
  WEEKLY
}

type RecurrencePattern {
  dayOfMonth: Int
  daysOfWeek: [Int!]
  endDate: DateTime
  frequency: RecurrenceFrequency!
  interval: Int!
  maxOccurrences: Int
}

input RecurrencePatternInput {
  dayOfMonth: Int
  daysOfWeek: [Int!]
  endDate: DateTime
  frequency: RecurrenceFrequency!
  interval: Int!
  maxOccurrences: Int
}

enum RecurrenceType {
  BIWEEKLY
  CUSTOM
  DAILY
  MONTHLY
  WEEKLY
}

input RegisterInput {
  email: String!
  name: String
  password: String!
}

input SearchTasksDto {
  budgetType: [BudgetType!]
  categoryId: Int
  categoryIds: [Int!]
  deadlineAfter: String
  deadlineBefore: String
  deadlineDateRange: DateRangeInput
  includeDeleted: Boolean = false
  latitude: Float
  limit: Int = 10
  location: String
  longitude: Float
  maxBudget: Float
  minBudget: Float
  onlyBoostedTasks: Boolean = false
  page: Int = 1
  radius: Float
  search: String = ""
  searchTerm: String
  skillIds: [Int!]
  sortBy: String = "createdAt"
  sortOrder: String = "desc"
  status: [TaskStatus!]
  taskType: [TaskType!]
}

type Skill {
  approved: Boolean
  categoryId: Float
  createdAt: DateTime!
  id: ID!
  isVerifiable: Boolean
  name: String!
  updatedAt: DateTime!
}

enum SkillImportance {
  BONUS
  PREFERRED
  REQUIRED
}

type Task {
  attachments: [AttachmentOutput!]
  bids: [Bid!]
  budget: Float
  budgetType: BudgetType!
  categoryIds: [Int!]
  client: Client!
  clientId: Int!
  createdAt: String!
  dateRange: DateRangeOutput
  deadlineDate: String
  deletedAt: String
  description: String!
  dropOffLocation: LocationOutput
  estimatedHours: Int
  freelancerId: Int
  id: ID!
  imageUrls: [String!]
  isRemovals: Boolean!
  pickupLocation: LocationOutput
  skillIds: [Int!]
  status: TaskStatus!
  taskType: TaskType!
  title: String!
  updatedAt: String!
  visibility: TaskVisibility!
}

enum TaskStatus {
  CANCELLED
  COMPLETED
  DISPUTED
  DRAFT
  IN_PROGRESS
  OPEN
}

type TaskTemplateResponse {
  createdAt: String
  description: String
  id: ID!
  isRecurring: Boolean!
  name: String
  recurrencePattern: RecurrencePattern
  task: Task!
  updatedAt: String
  userId: Int
}

enum TaskType {
  IN_PERSON
  REMOTE
}

enum TaskVisibility {
  FOLLOWERS_ONLY
  INVITE_ONLY
  PRIVATE
  PUBLIC
}

type TokenVerificationResult {
  isValid: Boolean!
  user: User
}

input TurnstileVerificationInput {
  action: String
  token: String!
}

type TurnstileVerificationResult {
  message: String
  success: Boolean!
}

input UpdateBidInput {
  amount: Float
  coverLetter: String
  currency: String
  description: String
  estimatedDuration: String
  estimatedHours: Int
  hourlyRate: Float
  milestones: [CreateBidMilestoneInput!]
  paymentType: BidPaymentType
  proposedApproach: String
  responseTime: Int
  visibility: BidVisibility
}

input UpdateTaskInput {
  addressLine1: String
  addressLine2: String
  attachments: [AttachmentInput!]
  budget: Float
  budgetType: BudgetType
  categoryIds: [Int!]
  city: String
  country: String
  dateRange: DateRangeInput
  deadlineDate: String
  description: String
  dropOffLocation: LocationInput
  estimatedHours: Float
  imageUrls: [String!]
  isRemovals: Boolean
  latitude: Float
  longitude: Float
  pickupLocation: LocationInput
  postalCode: String
  skillIds: [Int!]
  skillImportance: SkillImportance
  state: String
  status: TaskStatus
  taskType: TaskType
  title: String
  visibility: TaskVisibility
}

input UpdateTaskTemplateInput {
  recurrencePattern: RecurrencePatternInput
  task: UpdateTaskInput
}

input UpdateUserInput {
  biddingAllowed: Boolean
  dob: DateTime
  email: String
  isEmailVerified: Boolean
  location: UpdateUserLocationInput
  mobileNumber: String
  name: String
  onboardingComplete: Boolean
  profilePictureId: String
  profilePictureUrl: String
  status: UserStatus
  userRole: UserRole
}

input UpdateUserLocationInput {
  displayName: String!
  latitude: Float!
  longitude: Float!
  serviceRadius: Float
  zipCode: String
}

input UpdateUserProfileInput {
  displayName: String
  location: UpdateUserLocationInput
  professionalTitle: String
  profileDescription: String
  profilePictureId: String
  profilePictureUrl: String
  skills: [String!]
  username: String
}

type User {
  biddingAllowed: Boolean!
  createdAt: DateTime!
  deletedAt: DateTime
  displayName: String
  dob: DateTime
  email: String
  id: ID!
  isEmailVerified: Boolean!
  lastLoginAt: DateTime
  location: UserLocation
  mobileNumber: String
  name: String
  onboardingComplete: Boolean!
  profilePictureId: String
  profilePictureUrl: String
  skills: [Skill!]!
  status: UserStatus!
  updatedAt: DateTime!
  userRole: UserRole!
  username: String
}

type UserBidsResponse {
  received: BidsWithPaginationDto!
  submitted: BidsWithPaginationDto!
}

type UserLocation {
  createdAt: DateTime!
  displayName: String!
  latitude: Float!
  longitude: Float!
  serviceRadius: Float
  updatedAt: DateTime!
  zipCode: String
}

enum UserRole {
  ADMIN
  BOTH
  CLIENT
  FREELANCER
}

enum UserStatus {
  ACTIVE
  BANNED
  INACTIVE
  SUSPENDED
}
