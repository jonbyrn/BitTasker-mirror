# Local Typesense for BitTasker search.
# Railway: create a service from image typesense/typesense:27.1, set the same
# TYPESENSE_API_KEY variable, and expose port 8108. Point TYPESENSE_HOST at
# that service. Leave SEARCH_PROVIDER=meilisearch until the indexer has run.
services:
  typesense:
    image: typesense/typesense:27.1
    restart: unless-stopped
    ports:
      - '8108:8108'
    environment:
      TYPESENSE_DATA_DIR: /data
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:?Set TYPESENSE_API_KEY}
      TYPESENSE_ENABLE_CORS: 'true'
    volumes:
      - typesense-data:/data

volumes:
  typesense-data:
