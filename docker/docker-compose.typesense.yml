# Local Typesense for the BitTasker sandbox.
# Deploy notes: docs/typesense-sandbox.md
# The admin key is read from the environment. Do not commit it and do not put it in VITE_ vars.
services:
  typesense:
    image: typesense/typesense:27.1
    restart: unless-stopped
    ports:
      - '8108:8108'
    environment:
      TYPESENSE_DATA_DIR: /data
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:?Set TYPESENSE_API_KEY}
      TYPESENSE_ENABLE_CORS: 'true'
    volumes:
      - typesense-data:/data

  indexer:
    image: node:22-bookworm
    working_dir: /app
    restart: unless-stopped
    depends_on:
      - typesense
    volumes:
      - ..:/app
    environment:
      SEARCH_PROVIDER: typesense
      TYPESENSE_HOST: http://typesense:8108
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:?Set TYPESENSE_API_KEY}
      NOSTR_RELAY_URLS: ${NOSTR_RELAY_URLS:-wss://relay2.bittasker.com}
      BITTASKER_TEST_PUBKEYS: ${BITTASKER_TEST_PUBKEYS:-}
    command: node scripts/typesense-indexer.mjs

volumes:
  typesense-data:
