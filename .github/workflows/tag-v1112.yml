name: Tag GitLab v1.1.12
on:
  push:
    branches: ['cursor/tag-v1112-06a7']
jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Play manual Android release jobs
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          CI_API_TOKEN: ${{ secrets.CI_API_TOKEN }}
          GITLAB_API_TOKEN: ${{ secrets.GITLAB_API_TOKEN }}
          ZAPSTORE_GITLAB_TOKEN: ${{ secrets.ZAPSTORE_GITLAB_TOKEN }}
        run: |
          set -eu
          python3 << 'PY'
          import json, os, urllib.request, urllib.error
          base = "https://gitlab.com/api/v4/projects/72565223"
          names = ["CI_API_TOKEN", "GITLAB_API_TOKEN", "ZAPSTORE_GITLAB_TOKEN", "GITLAB_TOKEN"]
          tokens = [(name, os.environ.get(name) or "") for name in names]

          def try_get(token):
              headers = {"PRIVATE-TOKEN": token}
              request = urllib.request.Request(base + "/pipelines/2977915583", headers=headers)
              try:
                  with urllib.request.urlopen(request, timeout=60) as response:
                      return response.status, response.read().decode()
              except urllib.error.HTTPError as error:
                  return error.code, error.read().decode(errors="replace")[:180]

          chosen = None
          for name, token in tokens:
              if not token:
                  print(name, "unset")
                  continue
              status, body = try_get(token)
              print(name, "len", len(token), "HTTP", status, body[:120].replace(token, "[redacted]"))
              if status == 200 and chosen is None:
                  chosen = token
          if not chosen:
              raise SystemExit("no GitHub secret can read the v1.1.12 pipeline")
          request = urllib.request.Request(
              base + "/jobs/17393241436/play",
              headers={"PRIVATE-TOKEN": chosen},
              method="POST",
          )
          try:
              with urllib.request.urlopen(request, timeout=60) as response:
                  print("zapstore-release play HTTP", response.status)
          except urllib.error.HTTPError as error:
              body = error.read().decode(errors="replace")[:300].replace(chosen, "[redacted]")
              print("zapstore-release play HTTP", error.code, body)
              raise SystemExit("failed to play zapstore-release")
          PY
