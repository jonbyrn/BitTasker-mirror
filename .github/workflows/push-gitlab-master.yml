name: Fast-forward GitLab master

# One-shot deploy bridge. GitHub master is the source of truth for this push.
# The job checks out master, not this branch, and refuses a non-fast-forward.
on:
  push:
    branches:
      - cursor/push-gitlab-master-d38d

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: master
      - name: Fast-forward GitLab master
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GITLAB_TOKEN"
          git push "https://oauth2:${GITLAB_TOKEN}@gitlab.com/bittasker/BitTasker.git" "HEAD:refs/heads/master"
