name: Sandbox branch access
on:
  workflow_dispatch:
jobs:
  protect:
    runs-on: ubuntu-latest
    steps:
      - name: Allow the sandbox deploy to read protected CI variables
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          python3 << 'PY'
          import json, os, urllib.parse, urllib.request
          token = os.environ["GITLAB_TOKEN"]
          project = "72565223"
          base = "https://gitlab.com/api/v4"

          def call(method, path, body=None):
              data = urllib.parse.urlencode(body).encode() if body else None
              req = urllib.request.Request(
                  base + path,
                  data=data,
                  method=method,
                  headers={"PRIVATE-TOKEN": token},
              )
              try:
                  with urllib.request.urlopen(req) as res:
                      raw = res.read().decode()
                      return res.status, json.loads(raw) if raw else {}
              except urllib.error.HTTPError as err:
                  raw = err.read().decode()
                  try:
                      payload = json.loads(raw)
                  except json.JSONDecodeError:
                      payload = {"message": "non-json response"}
                  return err.code, payload

          for key in ("CLOUDFLARE_API_TOKEN", "CLOUDFLARE_ACCOUNT_ID"):
              status, row = call("GET", f"/projects/{project}/variables/{key}")
              if not isinstance(row, dict):
                  print(f"{key} status={status} unexpected")
                  continue
              print(
                  f"{key} status={status} protected={row.get('protected')} "
                  f"scope={row.get('environment_scope')} masked={row.get('masked')} "
                  f"has_value={bool(row.get('value'))} message={row.get('message', '')}"
              )

          status, row = call(
              "POST",
              f"/projects/{project}/protected_branches",
              {
                  "name": "sandbox/rgb-wasm-phase0",
                  "push_access_level": "30",
                  "merge_access_level": "40",
                  "allow_force_push": "false",
              },
          )
          if isinstance(row, dict):
              print(
                  f"protect status={status} name={row.get('name', '')} "
                  f"message={row.get('message', '')}"
              )
          else:
              print(f"protect status={status}")
          PY
