name: Sync to GitLab
on:
  push:
    branches: ['cursor/**', 'sandbox/rgb-wasm-phase0']
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push branch to GitLab
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          git push "https://oauth2:${GITLAB_TOKEN}@gitlab.com/bittasker/BitTasker.git" "HEAD:refs/heads/${GITHUB_REF_NAME}"
