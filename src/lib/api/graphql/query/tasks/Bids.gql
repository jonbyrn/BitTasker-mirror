query MyBids {
  bids {
    received {
      data {
        id
        freelancer {
          user {
            name
          }
        }
        amount
        currency
        status
        description
      }
    }
    submitted {
      data {
        id
        freelancer {
          user {
            name
          }
        }
        amount
        currency
        status
        description
      }
    }
  }
}