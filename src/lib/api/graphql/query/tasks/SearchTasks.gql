query SearchTasks($input: SearchTasksDto!) {
				tasks(input: $input) {
					items {
						id
						title
						description
						budget
						status
						createdAt
						deadlineDate
						taskType
						dateRange {
							start
							end
						}
						skillIds
						pickupLocation {
							displayName
							zipCode
						}
						userProfile {
							id
							user {
								id
								username
							}
						}
						bids {
							id
						}
					}
					meta {
						currentPage
						itemCount
						itemsPerPage
						totalItems
						totalPages
						hasNextPage
						hasPreviousPage
					}
				}
			}