mutation UpdateUser($input: UpdateUserProfileInput!) {
	updateUserProfile(input: $input) {
		id
		name
		email
		profilePictureUrl
		profilePictureId
		onboardingComplete
		userRole
		location {
			displayName
			latitude
			longitude
			zipCode
		}
		lastLoginAt
		isEmailVerified
		status
		createdAt
		updatedAt
	}
}
