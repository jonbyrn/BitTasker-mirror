mutation UpdateUserProfile($input: UpdateUserProfileInput!) {
  updateUserProfile(input: $input) {
    id
    username
    displayName
    name
    email
    profilePictureUrl
    profilePictureId
    onboardingComplete
    userRole
    location {
      displayName
      latitude
      longitude
      zipCode
    }
    lastLoginAt
    isEmailVerified
    status
    createdAt
    updatedAt
  }
} 