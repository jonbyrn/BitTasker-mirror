<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<script>
			(function () {
				var key = 'bt-client-purge-160';
				try {
					if (!window.sessionStorage || sessionStorage.getItem(key)) return;
					sessionStorage.setItem(key, '1');
					if (!('serviceWorker' in navigator)) return;
					var controlling = !!navigator.serviceWorker.controller;
					navigator.serviceWorker.getRegistrations().then(function (regs) {
						return Promise.all(regs.map(function (reg) { return reg.unregister(); })).then(function () {
							if (!('caches' in window)) return;
							return caches.keys().then(function (keys) {
								return Promise.all(keys.map(function (name) { return caches.delete(name); }));
							});
						});
					}).then(function () {
						if (controlling) location.reload();
					});
				} catch (e) {}
			})();
		</script>
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, minimum-scale=1.0, interactive-widget=resizes-content"
		/>
		<!-- Removed theme-color to use default system navigation bar color -->
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="BitTasker" />
		
		<!-- Font Optimization: Preconnect, Preload, and optimized loading -->
		<link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap" />
		<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Droid+Serif:wght@400;700&display=swap" />
		<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
		<link href="https://fonts.googleapis.com/css2?family=Droid+Serif:wght@400;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
		
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<style>
			#wallet-boot-skeleton {
				display: none;
				position: fixed;
				inset: 0;
				z-index: 30;
				box-sizing: border-box;
				background: #363636;
				padding: 1.25rem 1rem;
				flex-direction: column;
				gap: 0.75rem;
			}
			#wallet-boot-skeleton.is-on {
				display: flex;
			}
			#wallet-boot-skeleton .bar,
			#wallet-boot-skeleton .total,
			#wallet-boot-skeleton .card,
			#wallet-boot-skeleton .dot {
				background: #4b4b4b;
				border-radius: 0.75rem;
			}
			#wallet-boot-skeleton .bar {
				height: 0.75rem;
				width: 8rem;
				margin: 0.5rem auto 0;
			}
			#wallet-boot-skeleton .total {
				height: 2.25rem;
				width: 10rem;
				margin: 0 auto 0.5rem;
			}
			#wallet-boot-skeleton .card {
				height: 5.5rem;
			}
			#wallet-boot-skeleton .actions {
				display: flex;
				justify-content: space-between;
				margin-top: 0.5rem;
			}
			#wallet-boot-skeleton .dot {
				width: 4rem;
				height: 4rem;
				border-radius: 999px;
			}
		</style>
		<div id="wallet-boot-skeleton" aria-hidden="true">
			<div class="bar"></div>
			<div class="total"></div>
			<div class="card"></div>
			<div class="card"></div>
			<div class="actions">
				<div class="dot"></div>
				<div class="dot"></div>
				<div class="dot"></div>
				<div class="dot"></div>
			</div>
		</div>
		<script>
			(function () {
				try {
					var path = location.pathname.replace(/\/$/, '') || '/';
					if (path !== '/wallet') return;
					var el = document.getElementById('wallet-boot-skeleton');
					if (el) el.classList.add('is-on');
				} catch (e) {}
			})();
		</script>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
