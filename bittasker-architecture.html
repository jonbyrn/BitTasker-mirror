<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BitTasker - Native Architecture Map</title>
<style>
:root{--bg:#0b1220;--panel:#0f1a2e;--ink:#e8eef7;--muted:#93a4bd;--line:#2a3a55;--edge:#3b5170;--gold:#f5b301;--accent:#0fb9a6;--node:#16233c}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui,sans-serif;background:var(--bg);color:var(--ink)}#app{display:flex;width:100vw;height:100vh}#stage{position:relative;flex:1;overflow:hidden;background:radial-gradient(1000px 600px at 20% 0,#10203a,transparent 65%),var(--bg)}#topbar{position:absolute;z-index:2;top:0;left:0;padding:14px 18px;background:linear-gradient(#0b1220ee,transparent);pointer-events:none}h1{font-size:16px;margin:0}h1 span{color:var(--accent)}#controls{position:absolute;z-index:3;top:12px;right:12px;display:flex;gap:6px}button{background:var(--panel);border:1px solid var(--line);border-radius:7px;color:var(--ink);padding:8px 11px;cursor:pointer}button:hover{border-color:var(--accent)}svg{width:100%;height:100%;cursor:grab}.edge{fill:none;stroke:var(--edge);stroke-width:1.5;opacity:.65}.edge.hi{stroke:var(--gold);stroke-width:3;opacity:1}.node{cursor:pointer}.node rect{fill:var(--node);stroke:#2c4160;stroke-width:1.4;rx:9}.node.sel rect,.node.path rect{stroke:var(--accent);stroke-width:2.5}.node text{fill:var(--ink);font-size:12px;font-weight:600;pointer-events:none}.layer{fill:#ffffff04;stroke:#ffffff0c;rx:12}.layer-label{fill:var(--muted);font-size:11px;font-weight:700;text-transform:uppercase}#side{width:360px;max-width:40vw;padding:16px;background:var(--panel);border-left:1px solid var(--line);overflow:auto}#side h2{font-size:14px;color:var(--muted);text-transform:uppercase;margin:0 0 8px}.sub{color:var(--muted);font-size:12px;line-height:1.5}.flow{margin:10px 0;border:1px solid var(--line);border-radius:9px;overflow:hidden}.flow h3{font-size:13px;margin:0;padding:11px;cursor:pointer}.flow h3:hover{background:#132038}.flow-body{display:none;padding:0 12px 12px;color:var(--muted);font-size:12px;line-height:1.5}.flow.open .flow-body{display:block}.flow-body ol{padding-left:22px}.pill{display:inline-block;color:var(--accent);border:1px solid var(--line);border-radius:20px;padding:3px 8px;font-size:10px;text-transform:uppercase}.info{font-size:13px;line-height:1.55}.info h3{font-size:16px}.muted{color:var(--muted)}
</style>
</head>
<body>
<div id="app"><main id="stage"><div id="topbar"><h1><span>Bit</span>Tasker - Architecture Map (Native Build)</h1><div class="muted">UTXO/RGB escrow, Svelte 5 Runes, Nostr transport, Changelly fiat</div></div><div id="controls"><button id="fit">Fit</button><button id="plus">+</button><button id="minus">-</button></div><svg id="graph"><g id="viewport"></g></svg></main><aside id="side"><h2>Explore Architecture</h2><p class="sub">Select a flow or component to trace the native client architecture.</p><div id="panel"></div></aside></div>
<script type="application/json" id="architecture-data">{
  "layers":["Client Shells","Svelte 5 SPA","Marketplace UI","Svelte 5 Runes","UTXO & RGB Escrow","Nostr Transport","Fiat On/Off Ramp"],
  "nodes":[
    ["Web PWA","Client Shells","Static client served by SvelteKit."],["Svelte 5 SPA Shell","Svelte 5 SPA","Client-side application shell."],["Tasks & Services Forms","Marketplace UI","Task publication and service hiring forms."],["Service Hiring Modal","Marketplace UI","ContractInitiationDrawer and ServiceInstantBuyModal."],["ContractRune","Svelte 5 Runes","Native escrow state manager for funding, release, dispute, and splits."],["Payment Split Logic","Svelte 5 Runes","Validates BTC, Lightning, and USDT allocations."],["@utexo/rgb-sdk-web","UTXO & RGB Escrow","Native Bitcoin and RGB WASM wallet SDK."],["RGB Command Queue","UTXO & RGB Escrow","Serialized fail-closed commit, witness, spend, and validation."],["BTC / Lightning / USDT","UTXO & RGB Escrow","Native settlement assets."],["Nostr Task Adapter","Nostr Transport","Signed task and service event publisher."],["Consignment Transport","Nostr Transport","Encrypted NIP-44 direct-message exchange for RGB proofs."],["Nostr State Attestation","Nostr Transport","Kind 31006 contract state attestations."],["Changelly Fiat Service","Fiat On/Off Ramp","Fiat quotes and on/off-ramp behind VITE_CHANGELLY_FIAT_ENABLED."]
  ],
  "edges":[["Web PWA","Svelte 5 SPA Shell"],["Svelte 5 SPA Shell","Tasks & Services Forms"],["Svelte 5 SPA Shell","Service Hiring Modal"],["Tasks & Services Forms","Nostr Task Adapter"],["Service Hiring Modal","ContractRune"],["Service Hiring Modal","Payment Split Logic"],["ContractRune","Payment Split Logic"],["ContractRune","RGB Command Queue"],["RGB Command Queue","@utexo/rgb-sdk-web"],["@utexo/rgb-sdk-web","BTC / Lightning / USDT"],["ContractRune","Nostr State Attestation"],["Consignment Transport","ContractRune"],["Consignment Transport","@utexo/rgb-sdk-web"],["Tasks & Services Forms","Changelly Fiat Service"]],
  "flows":[
    ["Task & Service Publication","Forms publish signed Nostr events directly.",["Tasks & Services Forms","Nostr Task Adapter","Nostr State Attestation"]],
    ["Service Hiring & UTXO Escrow","The client configures native payment splits and funds through ContractRune.",["Service Hiring Modal","Payment Split Logic","ContractRune","RGB Command Queue","@utexo/rgb-sdk-web","Nostr State Attestation"]],
    ["Consignment State Exchange","Encrypted Nostr DMs transport RGB invoices and state proofs.",["@utexo/rgb-sdk-web","Consignment Transport","ContractRune"]],
    ["Changelly Fiat On/Off-Ramp","Fiat quotes are gated by VITE_CHANGELLY_FIAT_ENABLED.",["Tasks & Services Forms","Changelly Fiat Service","BTC / Lightning / USDT"]]
  ]
}</script>
<script>
(()=>{const d=JSON.parse(document.getElementById('architecture-data').textContent),svg=document.getElementById('graph'),vp=document.getElementById('viewport'),panel=document.getElementById('panel'),NS='http://www.w3.org/2000/svg';const colors=['#0f766e','#0d9488','#0891b2','#14b8a6','#f5b301','#7c3aed','#2563eb'];let nodes={},edges=[],scale=1,ox=0,oy=0;const el=(t,a={})=>{const x=document.createElementNS(NS,t);Object.entries(a).forEach(([k,v])=>x.setAttribute(k,v));return x};let x=55,y=110;d.layers.forEach((layer,li)=>{const items=d.nodes.filter(n=>n[1]===layer),lx=x+li*205;const band=el('rect',{x:lx-25,y:70,width:180,height:Math.max(390,items.length*70),class:'layer'});vp.appendChild(band);const label=el('text',{x:lx+65,y:92,'text-anchor':'middle',class:'layer-label'});label.textContent=layer;label.setAttribute('fill',colors[li%colors.length]);vp.appendChild(label);items.forEach((n,i)=>{const p={x:lx,y:115+i*70,w:150,h:42};nodes[n[0]]=p;const g=el('g',{class:'node',transform:`translate(${p.x},${p.y})`});const r=el('rect',{width:p.w,height:p.h});const t=el('text',{x:10,y:25});t.textContent=n[0];g.append(r,t);g.onclick=()=>showNode(n);vp.appendChild(g);n._g=g})});d.edges.forEach(e=>{const a=nodes[e[0]],b=nodes[e[1]];if(!a||!b)return;const path=el('path',{d:`M${a.x+a.w},${a.y+21} C${a.x+185},${a.y+21} ${b.x-35},${b.y+21} ${b.x},${b.y+21}`,class:'edge'});vp.insertBefore(path,vp.firstChild);edges.push({e,path})});function apply(){vp.setAttribute('transform',`translate(${ox},${oy}) scale(${scale})`)}function fit(){const r=svg.getBoundingClientRect();scale=Math.min(r.width/(d.layers.length*205+120),r.height/580)*.9;ox=(r.width-(d.layers.length*205+120)*scale)/2;oy=25;apply()}document.getElementById('plus').onclick=()=>{scale=Math.min(2,scale*1.2);apply()};document.getElementById('minus').onclick=()=>{scale=Math.max(.2,scale/1.2);apply()};document.getElementById('fit').onclick=fit;function showNode(n){panel.innerHTML=`<div class="info"><span class="pill">${n[1]}</span><h3>${n[0]}</h3><p class="muted">${n[2]}</p></div>`;d.nodes.forEach(x=>x._g.classList.remove('sel'));n._g.classList.add('sel')}d.flows.forEach(f=>{const box=document.createElement('div');box.className='flow';box.innerHTML=`<h3>${f[0]}</h3><div class="flow-body"><p>${f[1]}</p><ol>${f[2].map(x=>`<li>${x}</li>`).join('')}</ol></div>`;box.querySelector('h3').onclick=()=>box.classList.toggle('open');panel.appendChild(box)});fit()})();
</script>
</body>
</html>
